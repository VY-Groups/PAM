# Gitleaks configuration - used by the CI security job and locally:
#   docker run --rm -v <repo>:/repo:ro zricethezav/gitleaks:v8.24.2 \
#     detect --source /repo --config /repo/.gitleaks.toml
#
# Every allowlist entry carries its written justification: nothing is
# silenced blindly (docs/SECURITY_COMPLIANCE.md honesty invariant).

[extend]
useDefault = true

[allowlist]
description = "Documented false positives and historical dev artifacts"

# The six license_*.json files are phase-1/2-era DEV license outputs from the
# initial commit: signed claim sets (license_key UUID + entitlements), never
# private key material. They were removed from the working tree when the
# CI hardening landed; the objects stay in git history and are allowlisted
# here so the scan keeps watching for NEW leaks.
paths = ['''license_[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}\.json$''']

regexes = [
  # The two screen-10 test fixtures (frontend/app/src/test/licensingFixtures.ts)
  # carry these license_key values: the license_key is the product's PUBLIC
  # identifier (published in every /api/v1/licenses response; 62070B33… already
  # lives in the tracked complianceFixtures.ts) - license security is the RSA
  # signature over the claim set, never the key's secrecy. Same class as the
  # license_*.json allowlist above: signed claim sets, never private key
  # material. The two exact identifiers only - any other UUID-shaped secret
  # still fails the scan.
  '''31ED5F43-6D34-4553-88FA-1D0E6113C6DD|62070B33-4ACD-417B-A4FC-BE00A59498C7''',
  # The two raw jwt file answers in the same fixtures are SIGNED LICENSE TOKENS
  # (RS256 header, payload = the license_data claims starting with
  # classification): distribution artifacts by design - the whole air-gap
  # ingestion flow hands this token to the customer out-of-band. The matching
  # PUBLIC verification key is tracked in the repo; the private signing key
  # never enters it. Scoped to the license-token payload prefix so any other
  # RS256 JWT still fails the scan.
  '''eyJhbGciOiJQUzI1NiIsInR5cCI6IkpXVCJ9\.eyJjbGFzc2lmaWNhdGlvbiI6''',
  # A deliberately weak password used ONLY by the password-policy test
  # (backend/phase2_license_server/tests/test_identity.py) - the point of the
  # fixture is that it is short.
  '''short1234567''',
  # A test RADIUS shared secret used only against the in-test RADIUS stub
  # (backend/phase2_license_server/tests/test_radius.py).
  '''s3cret-radius-beam''',
  # gitleaks matches the keyword PRIVATE_KEY; these two hits are the tmp_path
  # file NAME "rsa.pem" in a config-plumbing test, not key material
  # (pam_master/tests/test_skeleton.py).
  '''MASTER_RSA_PRIVATE_KEY_PATH''',
  # base64 of the ASCII string "hello-world": a config-plumbing fixture that
  # an older revision of pam_master/tests/test_skeleton.py used for
  # MASTER_CUSTOMER_KEY_B64. Not key material.
  '''aGVsbG8td29ybGQ=''',
  # The three demo console passwords in tools/demo_seed.py are PUBLIC dev-rig
  # values, documented in that file's docstring: they only ever exist on a
  # local demo/CI rig that anyone on the machine can already administrate,
  # and are never reused anywhere else. Allowlisted so the scan keeps
  # watching for NEW secrets in the seed script.
  '''Zephyr-Console-7391-Qx!|Harbor-Session-4826-Kv!|Lantern-Audit-5173-Nt!''',
  # The RBAC binding fixtures (frontend/app/src/test/settingsFixtures.ts)
  # carry `token_prefix` values captured verbatim from the live rig. The
  # contract documents the field as "The public part of the minted token
  # (`vypam-rbac1.<id>.`) - never the secret" (openapi.yaml RoleBinding) -
  # it identifies the binding, not the credential, and the matching secret
  # is sha256 at rest on the rig. The one-time token's BODY value never
  # entered the file at all (redacted; its real string's death was captured
  # as a 401 before the fixture was written). Scoped to the token_prefix
  # assignment shape only: a full token string, the `token:` field, or any
  # other vypam-rbac-shaped value still fails the scan. Pattern anchors both
  # the assignment form and the bare prefix form, so a full token string
  # (`vypam-rbac1.<id>.<secret>`) never satisfies it.
  "^(token_prefix: ')?vypam-rbac1[.][0-9]+[.](')?$",
  # The two generated-password placeholders in the ADR-0016 identity
  # fixtures (frontend/app/src/test/identityFixtures.ts) are SYNTHETIC
  # literals written for this repo, per the SECRET_REVEAL house rule:
  # the rig's real one-time passwords were never transcribed - these
  # stand in their place so the fixtures prove the reveal/copy/UI
  # behaviour without carrying a credential-shaped string. The exact
  # two literals only - any other generated_password value still fails
  # the scan.
  '''fixture-GeneratedOnce-0000|fixture-ResetOnce-0000''',
  # The TOTP-enrol fixture body (frontend/app/src/test/securityFixtures.ts,
  # ADR-0017 batch 1, `ENROLL_TOTP_RESPONSE`) carries
  # `secret: 'fixture-TotpSecret-0000'` - same class as the two literals
  # above: the rig capture's real enrolled TOTP secret was substituted out
  # before the fixture was written (fixture-over-capture house rule), so no
  # credential-shaped value from the rig exists in any staged file. The exact
  # synthetic literal only - any other secret value still fails the scan.
  '''fixture-TotpSecret-0000''',
]
