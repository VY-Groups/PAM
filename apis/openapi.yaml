openapi: 3.1.0
info:
  title: VY-PAM License Server API
  version: 1.0.0
  description: |
    Issuing, revocation, validation and platform settings for VY-PAM
    (see `VY-PAM_Enterprise_PAM_Architecture.md`).

    Served by `backend/phase2_license_server`. Conventions:

    - All business endpoints live under `/api/v1`; `/health` is the
      unauthenticated liveness probe.
    - Errors are JSON: `{"error": "<message>", "details": {...}}`.
    - Admin operations require the admin token as
      `Authorization: Bearer <token>` **or** `X-Admin-Token: <token>`.
      When `LICENSE_ADMIN_TOKEN` is unset the server runs in open/dev mode
      and every route is allowed (responses then carry `X-Auth-Mode: open`).
    - Writes that name an actor accept an `X-Actor` header (settings).
    - List endpoints paginate with `limit` / `offset` (limit max 200).
    - Timestamps are ISO 8601 strings.
servers:
  - url: http://127.0.0.1:5000
    description: Local development server (LICENSE_SERVER_HOST/PORT)
tags:
  - name: ops
    description: Liveness and capability probes
  - name: licenses
    description: Import, read, lifecycle and runtime usage of licenses
  - name: validation
    description: Offline-parity validation and entitlement checks
  - name: settings
    description: Platform Settings screen (SSO / HSM / ZSP / WORM)
  - name: vault
    description: Credential vault inventory, rotation and checkouts
  - name: rotation
    description: Rotation engine - run due credentials, session-end trigger
  - name: jit
    description: JIT/JEA access - requests, risk evaluation, approvals, time-boxed grants
  - name: sessions
    description: Privileged sessions - recording, live monitoring, controls and playback
  - name: command-control
    description: Command Control - policy rules, dry-run decisions, approvals, incidents
  - name: discovery
    description: Discovery Engine - target assets, accounts and real scans
  - name: risk
    description: Risk-Based Access Engine - eight-component scores, bands and policy decisions
  - name: bypass
    description: PAM Bypass Detection - log ingest, correlation scans and direct-access incidents
paths:
  /health:
    get:
      tags: [ops]
      summary: Health probe
      description: Liveness plus database connectivity, configured key paths, supported algorithms and formats.
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        "503":
          description: Database unreachable (status "degraded")
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}

  /api/v1/meta:
    get:
      tags: [ops]
      summary: Server capabilities
      description: Algorithms, wire formats, license types, plans, tiers and the 8-module entitlement catalog.
      responses:
        "200":
          description: Capability document
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Meta"}

  /api/v1/licenses:
    get:
      tags: [licenses]
      summary: List licenses
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [active, revoked, expired]}
        - name: license_type
          in: query
          schema: {type: string}
        - name: issued_to
          in: query
          schema: {type: string}
        - name: tier
          in: query
          schema: {type: string}
        - name: q
          in: query
          description: Free-text search across key, ID and subject.
          schema: {type: string}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Page of licenses
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LicenseList"}
        "400": {$ref: "#/components/responses/BadRequest"}
  /api/v1/licenses/import:
    post:
      tags: [licenses]
      summary: Import a vendor-signed license
      description: >
        Installs the signed .lic from the delivery bundle. The server verifies
        the signature against its trusted public key and stores the claims
        exactly as signed — it never signs (issuing belongs to PAM-MASTER).
        Expired, structurally invalid or already-installed files are refused.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LicenseEnvelope"}
      responses:
        "201":
          description: License verified and stored
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ImportLicenseResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/licenses/{license_key}:
    get:
      tags: [licenses]
      summary: License detail
      description: Full record including usage summary and audit events.
      parameters:
        - {$ref: "#/components/parameters/LicenseKey"}
      responses:
        "200":
          description: One license
          content:
            application/json:
              schema:
                type: object
                required: [license]
                properties:
                  license: {$ref: "#/components/schemas/LicenseRecord"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/licenses/{license_key}/file:
    get:
      tags: [licenses]
      summary: Download the signed license file
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - {$ref: "#/components/parameters/LicenseKey"}
        - name: format
          in: query
          description: Defaults to the format the license was signed with.
          schema: {type: string, enum: [json, jwt]}
      responses:
        "200":
          description: Signed envelope (json) or compact token (jwt) as an attachment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LicenseEnvelope"}
            text/plain:
              schema: {type: string, description: Compact `header.payload.signature` token}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/licenses/{license_key}/revoke:
    post:
      tags: [licenses]
      summary: Revoke a license
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - {$ref: "#/components/parameters/LicenseKey"}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        "200":
          description: License revoked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LicenseMutationResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/licenses/{license_key}/restore:
    post:
      tags: [licenses]
      summary: Restore a revoked license
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - {$ref: "#/components/parameters/LicenseKey"}
      responses:
        "200":
          description: License restored to active
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LicenseMutationResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/licenses/{license_key}/usage:
    post:
      tags: [licenses]
      summary: Report runtime usage
      description: |
        A deployed instance reports consumption. Only the known usage fields
        plus `pools` (node-quota pools by id) are accepted; values are
        non-negative integers. The report is appended to the audit trail.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - {$ref: "#/components/parameters/LicenseKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UsageReportRequest"}
      responses:
        "201":
          description: Usage recorded
          content:
            application/json:
              schema:
                type: object
                required: [license, usage, message]
                properties:
                  license: {$ref: "#/components/schemas/LicenseRecord"}
                  usage: {$ref: "#/components/schemas/UsageSummary"}
                  message: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/licenses/validate:
    post:
      tags: [validation]
      summary: Validate a license payload
      description: |
        Full check: structure -> cryptographic signature -> revocation list ->
        expiry. Accepts a JSON envelope, a `{license: ...}` / `{token: ...}`
        wrapper, or a compact token as a raw string body
        (`curl --data-binary @license.lic`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Envelope, wrapper, or the compact token as a JSON string.
              anyOf:
                - {$ref: "#/components/schemas/LicenseEnvelope"}
                - type: object
                  properties:
                    license: {type: object, additionalProperties: true}
                  additionalProperties: true
                - type: object
                  properties:
                    token: {type: string}
                  additionalProperties: true
                - type: string
          text/plain:
            schema: {type: string, description: Compact token (three dot-separated segments)}
      responses:
        "200":
          description: Verdict (also returned for invalid licenses)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ValidationResult"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/licenses/{license_key}/check:
    post:
      tags: [validation]
      summary: Check feature / module / quota access
      description: Ask any combination of `feature`, `module_id` (one of the 8 catalog ids) and `limit_type` + `current_usage` in one call.
      parameters:
        - {$ref: "#/components/parameters/LicenseKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                feature: {type: string}
                module_id:
                  type: string
                  description: One of the 8 entitlement module ids.
                limit_type: {type: string}
                current_usage: {type: integer, minimum: 0}
              additionalProperties: false
      responses:
        "200":
          description: Per-dimension verdict
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccessCheck"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/settings:
    get:
      tags: [settings]
      summary: Read all settings groups + schema
      description: |
        Every group (`sso`, `hsm`, `zsp`, `worm`) with its stored-or-default
        values plus the render schema (types, ranges, enums, defaults).
        Public so the Platform Settings screen can render read-only.
      responses:
        "200":
          description: Settings and schema
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingsResponse"}

  /api/v1/settings/audit:
    get:
      tags: [settings]
      summary: Configuration changelog
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 0, maximum: 200, default: 20}
      responses:
        "200":
          description: Settings events, newest first
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingsAuditResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/settings/{group}:
    put:
      tags: [settings]
      summary: Update one settings group
      description: |
        Merges the given fields into the group after strict validation
        (unknown fields/groups, wrong types, out-of-range values, malformed
        enums/URLs/bucket names are rejected with 400). A no-op write returns
        `{"message": "No changes"}` and records no event. Every accepted
        change appends a `SettingsEvent` with the actor (`X-Actor` header,
        else the authenticated admin) and a per-field old/new diff.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: group
          in: path
          required: true
          schema: {type: string, enum: [sso, hsm, zsp, worm]}
        - name: X-Actor
          in: header
          description: Who is making the change (recorded in the audit changelog).
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              description: One or more fields of the group (see `schema` in GET /api/v1/settings).
              additionalProperties: true
      responses:
        "200":
          description: Stored (or no changes)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SettingsWriteResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/overview:
    get:
      tags: [ops]
      summary: Dashboard aggregate for the Command Center and Compliance screens
      description: |
        Health, license posture, vault stats, settings posture, event
        counters, a computed control posture (`score`, `violations`, per-control
        `passed` / `evidence`) and the six most recent activity entries.
      responses:
        "200":
          description: Aggregated dashboard payload
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Overview"}

  /api/v1/events:
    get:
      tags: [ops]
      summary: Unified recent activity feed
      description: Recent entries from the immutable audit ledger (architecture 19) across every trail - license, settings, vault, discovery, JIT, session lifecycle, command control and risk evaluation - newest first. Each entry carries its chain position (seq) and content hash (event_hash).
      parameters:
        - name: source
          in: query
          schema: {type: string, enum: [license, settings, vault, discovery, jit, session, command, risk]}
        - name: limit
          in: query
          schema: {type: integer, minimum: 0, maximum: 200, default: 20}
      responses:
        "200":
          description: Events newest first across the selected trails
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EventFeed"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/audit/stats:
    get:
      tags: [ops]
      summary: Immutable audit ledger aggregates
      description: Real totals by source, the chain position and head hash of the ledger, and whether the append-only triggers are installed.
      responses:
        "200":
          description: Ledger statistics
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditStats"}

  /api/v1/audit/verify:
    get:
      tags: [ops]
      summary: Verify the audit hash chain
      description: Walks every ledger record in chain order, recomputing each hash and link; reports the first gap, re-link or content change (intact=false).
      responses:
        "200":
          description: Chain verification result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuditVerify"}

  /api/v1/audit/export:
    get:
      tags: [ops]
      summary: Export the ledger as NDJSON
      description: The full ledger in chain order, one JSON record per line (application/x-ndjson) - the same records a SIEM would ingest.
      responses:
        "200":
          description: Newline-delimited JSON audit records
          content:
            application/x-ndjson:
              schema:
                type: string
                description: One JSON audit record per line (seq, event_ref, source, action, actor, subject, detail, created_at, prev_hash, event_hash).

  /api/v1/vault/stats:
    get:
      tags: [vault]
      summary: Inventory aggregates
      description: Totals by type and status, rotation compliance, checkout count and today's events.
      responses:
        "200":
          description: Vault statistics
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VaultStats"}

  /api/v1/vault/items:
    get:
      tags: [vault]
      summary: List inventory rows
      parameters:
        - name: q
          in: query
          description: Free-text search across name, description, target and principal.
          schema: {type: string}
        - name: type
          in: query
          schema:
            type: string
            enum: [database, cloud_iam, ssh_key, service_account, domain_password, api_token]
        - name: status
          in: query
          schema:
            type: string
            enum: [available, checked_out, rotating, rotation_due, failed]
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Page of inventory rows
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VaultItemList"}
        "400": {$ref: "#/components/responses/BadRequest"}
    post:
      tags: [vault]
      summary: Onboard a credential
      description: Validates the payload strictly, stamps the first rotation window and records an audit event.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VaultOnboardRequest"}
      responses:
        "201":
          description: Credential added to the inventory
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VaultActionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/vault/items/{item_id}:
    get:
      tags: [vault]
      summary: Inventory row detail with its audit trail
      parameters:
        - name: item_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: One credential plus its recent events
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VaultItemDetail"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/vault/items/{item_id}/checkout:
    post:
      tags: [vault]
      summary: Check a credential out (JIT)
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: item_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          description: Who is checking the credential out (recorded in the audit trail).
          schema: {type: string, maxLength: 64}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string, maxLength: 255}
      responses:
        "200":
          description: Credential checked out
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VaultActionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/vault/items/{item_id}/revoke:
    post:
      tags: [vault]
      summary: End an active checkout
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: item_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          description: Who revokes the checkout (recorded in the audit trail).
          schema: {type: string, maxLength: 64}
      responses:
        "200":
          description: Checkout ended, credential available again
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VaultActionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/vault/items/{item_id}/rotate:
    post:
      tags: [vault]
      summary: Rotate now (also retries a failed rotation)
      description: |
        Runs the full rotation pipeline for one credential: mints a new
        type-appropriate secret, seals it with AES-256-GCM (version history
        kept), validates it by decrypt round-trip and records a `rotated`
        event with the result. No cascade (same-target dependents are updated
        by `POST /api/v1/rotation/run` or the session-end trigger).
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: item_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          description: Who triggers the rotation (recorded in the audit trail).
          schema: {type: string, maxLength: 64}
      responses:
        "200":
          description: Rotation recorded, status available
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RotationActionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "500":
          description: Rotation failed mid-pipeline (the item moves to `failed` and the error is audited).
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}

  /api/v1/vault/events:
    get:
      tags: [vault]
      summary: Vault audit trail
      description: Onboarding, checkouts, revocations and rotations, newest first.
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 0, maximum: 200, default: 20}
        - name: action
          in: query
          description: Return only one action type (unknown values are rejected with 400).
          schema:
            type: string
            enum: [onboarded, checked_out, revoked, rotated, rotation_failed]
      responses:
        "200":
          description: Vault events
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VaultEventFeed"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/vault/items/{item_id}/secret:
    get:
      tags: [vault]
      summary: Reveal a stored secret (admin-only)
      description: |
        Decrypts and returns the current secret version for one credential
        (AES-256-GCM, AAD bound to the item). Never included in list or
        detail responses - the value is only produced by this explicit
        reveal. Returns 404 for metadata-only records with no stored secret.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: item_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Decrypted secret value
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SecretReveal"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}

  /api/v1/rotation/run:
    post:
      tags: [rotation]
      summary: Run the rotation engine
      description: |
        Rotates every credential whose SLA window has elapsed (plus `failed`
        ones, so Retry works), or exactly the ids in `item_ids`. With
        `cascade` (default) each rotation also updates the other managed
        credentials on the same target, reporting per-item skip reasons
        (checked out, mid-rotation). Summary counts are measured after the
        run - `due_remaining` / `failed_remaining` are real database counts.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: X-Actor
          in: header
          description: Who triggers the run (recorded in each audit event).
          schema: {type: string, maxLength: 64}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RotationRunRequest"}
      responses:
        "200":
          description: Run summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RotationRunResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}

  /api/v1/rotation/session-end:
    post:
      tags: [rotation]
      summary: Event-based trigger - a checkout's session ended
      description: |
        Releases the checkout if one is held (audited as `revoked`), then
        rotates the credential with `trigger=session_end` and updates its
        same-target dependents: the architecture's
        checkout -> session end -> rotate -> update dependents -> validate ->
        audit flow, driven by the event instead of the clock.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: X-Actor
          in: header
          description: Who triggers the rotation (recorded in the audit trail).
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item_id]
              properties:
                item_id: {type: integer, minimum: 1}
                session_id:
                  type: string
                  maxLength: 64
                  description: Optional session reference recorded on the event.
      responses:
        "200":
          description: Rotation recorded, status available
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RotationActionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}

  /api/v1/jit/stats:
    get:
      tags: [jit]
      summary: JIT queue counts
      description: Real totals per status and per risk band (active grants' expiry is evaluated on the way).
      responses:
        "200":
          description: JIT statistics
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JitStats"}

  /api/v1/jit/requests:
    get:
      tags: [jit]
      summary: JIT queue, newest first
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, active, closed, expired, denied, blocked]
        - name: requester
          in: query
          description: Case-insensitive substring match on the requester.
          schema: {type: string}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Paged JIT requests
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JitRequestList"}
        "400": {$ref: "#/components/responses/BadRequest"}
    post:
      tags: [jit]
      summary: File an access request
      description: |
        Validates reason/ticket/window, then evaluates risk over real context:
        target tier, requested duration, off-hours on the local clock, the
        requester's own 24h history, ticket shape and credential health. LOW
        auto-approves, MEDIUM needs manager, HIGH needs manager + security,
        CRITICAL is blocked by policy. Factors come back with their points.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: X-Actor
          in: header
          description: Who files the request (defaults the requester field).
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JitCreateRequest"}
      responses:
        "201":
          description: Request filed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JitRequestResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/jit/requests/{request_id}:
    get:
      tags: [jit]
      summary: One request with its audit trail
      description: Evaluates grant expiry on the way, so a reading client always sees the real state.
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Request + events
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JitRequestDetail"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/jit/requests/{request_id}/approve:
    post:
      tags: [jit]
      summary: Record a manager or security approval
      description: |
        Approvers must differ from the requester (403 otherwise); each risk
        band has its required roles (MEDIUM: manager, HIGH: manager +
        security). Completing the required set moves the request to
        `approved`.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          description: Who approves (recorded on the request and in the trail).
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JitApproveRequest"}
      responses:
        "200":
          description: Approval recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JitRequestResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/jit/requests/{request_id}/deny:
    post:
      tags: [jit]
      summary: Deny a pending or blocked request
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          schema: {type: string, maxLength: 64}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/JitDenyRequest"}
      responses:
        "200":
          description: Request denied
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JitRequestResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/jit/requests/{request_id}/consume:
    post:
      tags: [jit]
      summary: Grant an approved request
      description: |
        Checks the credential out under the requester with `session_ref =
        jit-<id>` until `expires_at`; expiry (evaluated on every read, and on
        scheduler ticks) releases the checkout and rotates the credential.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          schema: {type: string, maxLength: 64}
      responses:
        "200":
          description: Access granted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JitRequestResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/jit/requests/{request_id}/close:
    post:
      tags: [jit]
      summary: End an active grant early
      description: Releases the checkout and rotates the credential (the session-end flow).
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: request_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          schema: {type: string, maxLength: 64}
      responses:
        "200":
          description: Access closed, credential rotated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/JitRequestResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/sessions/stats:
    get:
      tags: [sessions]
      summary: Session monitoring counts
      description: Real totals per session state plus recording counters (linked grants' expiry is evaluated on the way).
      responses:
        "200":
          description: Session statistics
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionStats"}

  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: Live session list, newest first
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [active, paused, locked, terminated, completed]}
        - name: protocol
          in: query
          schema: {$ref: "#/components/schemas/SessionProtocol"}
        - name: q
          in: query
          description: Case-insensitive substring match on target, actor or session ref.
          schema: {type: string}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Paged sessions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionList"}
        "400": {$ref: "#/components/responses/BadRequest"}
    post:
      tags: [sessions]
      summary: Start a privileged session
      description: |
        Protocol + target, optionally against a vault credential (checked out
        for the session under `session_ref = sess-<hex>`) or riding an active
        JIT grant (attached, no second checkout). The request is scored first
        (architecture 7: eight-component risk evaluation, returned as `risk`);
        CRITICAL is refused (403 with the evaluation), HIGH needs the approval
        of an active JIT grant. Control flags default on; every lifecycle
        change is appended to the recording as a status event.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: X-Actor
          in: header
          description: Who starts the session (recorded as the session actor).
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionStartRequest"}
      responses:
        "201":
          description: Session started (the response carries the risk evaluation)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/sessions/{session_id}:
    get:
      tags: [sessions]
      summary: One session with its latest recorded events
      description: Evaluates linked grant expiry on the way, so a reading client always sees the real state.
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Session + events + counters
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionDetail"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/sessions/{session_id}/events:
    get:
      tags: [sessions]
      summary: Session playback
      description: The recording in sequence order (asc by default; desc for a live tail).
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: type
          in: query
          schema: {type: string, enum: [keystroke, command, file_upload, file_download, clipboard, screenshot, note, status, approval]}
        - name: order
          in: query
          schema: {type: string, enum: [asc, desc], default: asc}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Recorded events
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionEventList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [sessions]
      summary: Record one channel event
      description: |
        Controls are enforced for real: a gated-off transfer/clipboard/
        screenshot is stored with `allowed=false` as evidence, keystrokes are
        content-withheld when `keystroke_log` is off, a paused/locked/ended
        session refuses events (409), and with `record` off only command and
        status events are kept (the safety channel is never silenced).
        Command events additionally run through command control: the matched
        rule decides `allow` / `approval` (held, `allowed=false`) / `block`
        (`allowed=false`), and a rule with `terminate_on_match` also raises
        the incident and terminates the session - returned under
        `escalation`.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          description: Who posted the event (goes into the watermark when on).
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionEventPost"}
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionEventResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/sessions/{session_id}/controls:
    post:
      tags: [sessions]
      summary: Update session control flags
      description: Flip recording/watermark/clipboard/transfer/screenshot controls on a live session (audited as a status event).
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionControlsUpdate"}
      responses:
        "200":
          description: Controls updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/sessions/{session_id}/pause:
    post:
      tags: [sessions]
      summary: Pause a running session
      description: The channel refuses events until the session is resumed.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          schema: {type: string, maxLength: 64}
      responses:
        "200":
          description: Session paused
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/sessions/{session_id}/lock:
    post:
      tags: [sessions]
      summary: Lock a session pending review
      description: Events are refused while locked until it is resumed.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          schema: {type: string, maxLength: 64}
      responses:
        "200":
          description: Session locked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/sessions/{session_id}/resume:
    post:
      tags: [sessions]
      summary: Resume a paused or locked session
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          schema: {type: string, maxLength: 64}
      responses:
        "200":
          description: Session resumed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/sessions/{session_id}/terminate:
    post:
      tags: [sessions]
      summary: Terminate a session (kill switch)
      description: |
        Ends the session and runs the release-and-rotate cascade exactly once:
        a linked JIT grant is closed with it, a held vault checkout is
        released and the credential rotated (`trigger=session_end`).
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          schema: {type: string, maxLength: 64}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionEndRequest"}
      responses:
        "200":
          description: Session terminated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionEndResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/sessions/{session_id}/complete:
    post:
      tags: [sessions]
      summary: Complete a session (natural end)
      description: Same release-and-rotate cascade as terminate, outcome `completed`.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          schema: {type: string, maxLength: 64}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionEndRequest"}
      responses:
        "200":
          description: Session completed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionEndResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/sessions/{session_id}/events/{seq}/approve:
    post:
      tags: [command-control]
      summary: Approve a held command
      description: |
        Releases a command held by an `approval` rule: the append-only
        recording gets a new `approved` row referencing it (`ref_seq`); the
        hold itself is never edited. 409 when the event is not a hold, the
        hold already has a resolution, or the session has ended.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: seq
          in: path
          required: true
          schema: {type: integer, minimum: 1, description: Sequence number of the held command.}
        - name: X-Actor
          in: header
          description: Who decides (recorded on the resolution row).
          schema: {type: string, maxLength: 64}
      responses:
        "200":
          description: Approval recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandApprovalResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/sessions/{session_id}/events/{seq}/deny:
    post:
      tags: [command-control]
      summary: Deny a held command
      description: Deny instead of release - an append-only `denied` row records the decision against the hold.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: seq
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          description: Who decides (recorded on the resolution row).
          schema: {type: string, maxLength: 64}
      responses:
        "200":
          description: Denial recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandApprovalResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/command-control/stats:
    get:
      tags: [command-control]
      summary: Command-control aggregates
      description: |
        Rule counts per action, today's real intercepts, the approval queue,
        incident posture and a content hash of the current policy
        (`engine_hash` changes whenever a rule changes).
      responses:
        "200":
          description: Command-control statistics
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandStats"}

  /api/v1/command-control/rules:
    get:
      tags: [command-control]
      summary: Policy rules in evaluation order
      description: |
        block -> approval -> allow; within an action the target-scoped rule
        wins, then the longer pattern, then the lowest id. Each rule carries
        its real `match_count` (recorded events it decided).
      parameters:
        - name: action
          in: query
          schema: {$ref: "#/components/schemas/CommandAction"}
        - name: q
          in: query
          description: Case-insensitive substring filter on name, pattern, description or target scope.
          schema: {type: string}
        - name: enabled
          in: query
          schema: {type: boolean}
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandRuleList"}
        "400": {$ref: "#/components/responses/BadRequest"}
    post:
      tags: [command-control]
      summary: Create a policy rule
      description: |
        Adds a rule (name, pattern, action; optional target glob,
        escalation flag, description, enabled). `terminate_on_match` is
        refused on non-block actions. The shipped section-9 policy seeds an
        empty table at startup - a rule deleted here stays deleted.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: X-Actor
          in: header
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommandRuleRequest"}
      responses:
        "201":
          description: Rule created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandRuleResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/command-control/rules/{rule_id}:
    put:
      tags: [command-control]
      summary: Edit a policy rule
      description: Partial update - send only the fields that changed.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: rule_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommandRuleRequest"}
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandRuleResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
    delete:
      tags: [command-control]
      summary: Delete a policy rule
      description: Recorded events keep their `rule_id` as history (incidents snapshot name and pattern too).
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: rule_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Rule deleted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandRuleDeleteResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/command-control/evaluate:
    post:
      tags: [command-control]
      summary: Dry-run a command line against the policy
      description: |
        Same engine the sessions use, no state changes: returns the decision,
        the deciding rule (null when nothing matched -> default allow) and
        whether posting the command would escalate.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommandEvaluateRequest"}
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandEvaluateResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/command-control/approvals:
    get:
      tags: [command-control]
      summary: Held commands awaiting a decision
      description: Holds on active sessions only - a hold whose session ended can never be resolved and stays evidence.
      responses:
        "200":
          description: Pending approvals
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandApprovalList"}

  /api/v1/command-control/incidents:
    get:
      tags: [command-control]
      summary: Escalation incidents, newest first
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [open, closed, all]}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandIncidentList"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/command-control/incidents/{incident_id}:
    get:
      tags: [command-control]
      summary: One incident with its preserved evidence
      parameters:
        - name: incident_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Incident
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandIncidentResponse"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/command-control/incidents/{incident_id}/close:
    post:
      tags: [command-control]
      summary: Close an incident after review
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: incident_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          schema: {type: string, maxLength: 64}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CommandIncidentCloseRequest"}
      responses:
        "200":
          description: Incident closed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CommandIncidentResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/discovery/stats:
    get:
      tags: [discovery]
      summary: Discovery aggregate (tiles, posture pills, type tabs)
      description: |
        Real counts over `discovered_assets`: totals, per-type / per-risk /
        per-PAM-status breakdowns, recorded account count, and scan history
        (`scans.last` is `null` until the first scan runs).
      responses:
        "200":
          description: Discovery counts
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DiscoveryStats"}

  /api/v1/discovery/assets:
    get:
      tags: [discovery]
      summary: Discovered target assets
      description: |
        Asset rows with free-text and type/risk/PAM-status filters, ordered
        attention-first (unmanaged, then risk severity, then address). Each row
        carries `vault_count`: vault credentials whose `target` matches the
        asset address exactly.
      parameters:
        - name: q
          in: query
          schema: {type: string}
        - name: type
          in: query
          schema: {$ref: "#/components/schemas/DiscoveryAssetType"}
        - name: risk
          in: query
          schema: {$ref: "#/components/schemas/DiscoveryRisk"}
        - name: pam_status
          in: query
          schema: {$ref: "#/components/schemas/DiscoveryPamStatus"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Asset page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DiscoveredAssetList"}
        "400": {$ref: "#/components/responses/BadRequest"}
    post:
      tags: [discovery]
      summary: Register and classify a target, ingest its admin account
      description: |
        Manual onboarding ("Onboard Target Host"): the operator supplies the
        address, the classification and the privileged principal. The asset
        lands as `managed`, a metadata-only vault credential and a classified
        account row are created, and both audit trails record the event.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DiscoveryOnboardRequest"}
      responses:
        "201":
          description: Target registered and vaulted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DiscoveryActionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/discovery/assets/{asset_id}:
    patch:
      tags: [discovery]
      summary: Operator overrides (PAM status, reclassification, notes)
      description: |
        Ignoring/ restoring an asset, reclassifying its family (recomputes the
        risk score) or editing hostname/detail/notes. At least one effective
        change is required.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: asset_id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DiscoveryAssetPatch"}
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DiscoveryActionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/discovery/assets/{asset_id}/onboard:
    post:
      tags: [discovery]
      summary: Adopt a discovered asset into the vault
      description: |
        The auto-onboard step of the pipeline, operator-triggered: the asset
        becomes `managed` and its admin account is ingested as a metadata-only
        vault credential plus a classified account row.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: asset_id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DiscoveryAdoptRequest"}
      responses:
        "201":
          description: Asset adopted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DiscoveryActionResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/discovery/accounts:
    get:
      tags: [discovery]
      summary: Recorded privileged accounts
      description: |
        Account rows created when an asset is onboarded (username pattern-
        classified into the reference taxonomy). Group-derived kinds (domain
        admins, local admins) require directory enumeration, which no module
        performs yet, so they are never guessed.
      parameters:
        - name: q
          in: query
          schema: {type: string}
        - name: kind
          in: query
          schema:
            type: string
            enum: [builtin_admin, database_admin, service_account, other]
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Account page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DiscoveredAccountList"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/discovery/scans:
    get:
      tags: [discovery]
      summary: Scan history (newest first)
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 0, maximum: 200, default: 20}
      responses:
        "200":
          description: Scan history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DiscoveryScanList"}
    post:
      tags: [discovery]
      summary: Run a real TCP-connect discovery scan
      description: |
        Single-flight, bounded (256 hosts / 24 ports per run) and synchronous:
        the response returns the finished scan with honest counters. Only
        scans targets the operator explicitly supplies - there is no default
        scope. New hosts are recorded as unmanaged assets; known hosts get
        their ports refreshed (managed keeps its operator classification).
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DiscoveryScanRequest"}
      responses:
        "201":
          description: Scan finished
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DiscoveryScanResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/risk/evaluate:
    post:
      tags: [risk]
      summary: Score one access request (architecture 7)
      description: |
        Eight components - user, device, asset, time, location, behavior,
        ticket and command - each read from a measured input (the subject's
        own 24h history, the discovered inventory, the live command policy,
        the local clock, the source address via stdlib ipaddress, the ITSM
        ticket shape) - sum to a score whose band drives the decision:
        0-25 allow, 26-50 MFA, 51-75 approval, 76-100 block. Console
        evaluations advise; session starts are gated on the same scores.
        The evaluation is recorded on the risk trail of the ledger.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: X-Actor
          in: header
          description: Who requested the evaluation.
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RiskEvaluateRequest"}
      responses:
        "201":
          description: Evaluation recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RiskEvaluateResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/risk/evaluations:
    get:
      tags: [risk]
      summary: Recorded evaluations, newest first
      parameters:
        - name: band
          in: query
          schema: {type: string, enum: [low, medium, high, critical]}
        - name: context
          in: query
          schema: {type: string, enum: [manual, session_start]}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Paged evaluations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RiskEvaluationList"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/risk/stats:
    get:
      tags: [risk]
      summary: Evaluation aggregates (bands, decisions, refusals)
      responses:
        "200":
          description: Real aggregates over the recorded evaluations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RiskStats"}

  /api/v1/bypass/ingest:
    post:
      tags: [bypass]
      summary: Parse a real log bundle into connection observations (architecture 10)
      description: |
        Accepts OpenSSH `Accepted ...` auth lines (target supplied with the
        bundle - the host the log came from) and structured JSON records
        from Windows / EDR / network telemetry exports (target and
        timestamp per line). Every line is kept verbatim as evidence;
        unparseable lines are counted, never invented. Ingestion is
        recorded on the `bypass` trail of the ledger. Correlation is a
        separate step (`POST /api/v1/bypass/scans`).
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: X-Actor
          in: header
          description: Who is ingesting the log bundle.
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BypassIngestRequest"}
      responses:
        "201":
          description: Bundle parsed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BypassIngestResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/bypass/signals:
    get:
      tags: [bypass]
      summary: Parsed observations, newest first
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [observed, candidate, covered, out_of_scope]}
        - name: q
          in: query
          description: Free-text search over user, source IP, target and origin.
          schema: {type: string, maxLength: 128}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Paged signals
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BypassSignalList"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/bypass/scans:
    post:
      tags: [bypass]
      summary: Correlate unscanned observations (architecture 10)
      description: |
        Each unscanned signal is checked against the managed inventory
        (`pam_status=managed` match on address or hostname) and against
        recorded privileged sessions covering the same user, host and
        moment. Outcomes: `covered` (it went through PAM),
        `out_of_scope` (not a managed target), or `candidate` - which
        opens an incident carrying the architecture's ACTION block: SOC
        alert (the ledger record), forced credential rotation through the
        real module-5 pipeline, and block source recorded honestly as
        `not_connected` until an enforcement connector exists.
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: X-Actor
          in: header
          description: Who is running the correlation scan.
          schema: {type: string, maxLength: 64}
      responses:
        "201":
          description: Scan finished
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BypassScanResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/v1/bypass/incidents:
    get:
      tags: [bypass]
      summary: Direct-access incidents, newest first
      parameters:
        - name: status
          in: query
          schema: {type: string, enum: [open, closed, all]}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Offset"}
      responses:
        "200":
          description: Paged incidents
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BypassIncidentList"}
        "400": {$ref: "#/components/responses/BadRequest"}

  /api/v1/bypass/incidents/{incident_id}:
    get:
      tags: [bypass]
      summary: One incident with its parsed log-line evidence
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: incident_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Incident plus evidence
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BypassIncidentResponse"}
        "404": {$ref: "#/components/responses/NotFound"}

  /api/v1/bypass/incidents/{incident_id}/close:
    post:
      tags: [bypass]
      summary: Analyst closure (note optional, recorded with who/when)
      security:
        - bearerAuth: []
        - adminTokenHeader: []
        - {}
      parameters:
        - name: incident_id
          in: path
          required: true
          schema: {type: integer, minimum: 1}
        - name: X-Actor
          in: header
          description: Who is closing the incident.
          schema: {type: string, maxLength: 64}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BypassIncidentCloseRequest"}
      responses:
        "200":
          description: Incident closed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BypassIncidentCloseResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /api/v1/bypass/stats:
    get:
      tags: [bypass]
      summary: Signal states, incidents and forced-rotation aggregates
      responses:
        "200":
          description: Real aggregates over signals, incidents and module actions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BypassStats"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Admin token as `Authorization: Bearer <token>`."
    adminTokenHeader:
      type: apiKey
      in: header
      name: X-Admin-Token
      description: The same admin token in a custom header (either is accepted).
  parameters:
    LicenseKey:
      name: license_key
      in: path
      required: true
      description: License key (UUID) **or** license ID (`LIC-...`).
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 0, maximum: 200, default: 50}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
  responses:
    BadRequest:
      description: Validation failed (`details` names the offending field(s)).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthorized:
      description: Admin token missing or wrong.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: Unknown license, settings group or route.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: The request conflicts with the current state (license already installed, credential already checked out, session already ended).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    ServiceUnavailable:
      description: |
        Vault encryption key unavailable (`VAULT_KEY_PATH` missing with
        `VAULT_AUTOGENERATE_KEY` disabled) or the key file is unusable.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: Self-approval attempted (requesters cannot approve their own access).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
        details:
          type: object
          additionalProperties: true
      additionalProperties: false

    Health:
      type: object
      required: [status, database, auth, algorithms, formats]
      properties:
        status: {type: string, enum: [ok, degraded]}
        database: {type: string, enum: [ok, error]}
        auth: {type: string, enum: [token, open]}
        private_key: {type: string, description: Configured RSA key path}
        algorithms:
          type: array
          items: {type: string, enum: [RSA-PSS-SHA256, Ed25519]}
        formats:
          type: array
          items: {type: string, enum: [json, jwt]}
        ed25519_key: {type: boolean, description: Ed25519 key pair present}

    Meta:
      type: object
      required: [algorithms, formats, license_types, tiers, modules]
      properties:
        algorithms:
          type: array
          items: {type: string}
        formats:
          type: array
          items: {type: string}
        license_types:
          type: array
          items: {type: string}
        plans:
          type: array
          items: {type: string}
        tiers:
          type: array
          items: {type: string}
        modules:
          type: array
          description: The 8-entry entitlement module catalog.
          items:
            type: object
            required: [id]
            properties:
              id: {type: string}
              name: {type: string}
              description: {type: string}
            additionalProperties: true

    LicenseEnvelope:
      type: object
      required: [license_data, signature]
      properties:
        license_data: {type: object, additionalProperties: true}
        signature: {type: string}
        algorithm: {type: string, enum: [RSA-PSS-SHA256, Ed25519]}
        version: {type: integer}
        format: {type: string}
      additionalProperties: true

    UsageSummary:
      type: object
      description: Reported consumption per usage field plus per-pool node counts.
      additionalProperties: true

    LicenseRecord:
      type: object
      required: [license_key, license_type, status, effective_status, created_at]
      properties:
        license_key: {type: string}
        license_type: {type: string}
        issued_to: {type: string}
        issued_date: {type: string, format: date}
        expires_on: {oneOf: [{type: string, format: date}, {type: "null"}]}
        features: {type: array, items: {type: string}}
        usage_limits: {type: object, additionalProperties: true}
        metadata: {type: object, additionalProperties: true}
        license_id: {type: string, nullable: true}
        tier: {type: string, nullable: true}
        plan: {type: string, nullable: true}
        subject_entity: {type: string, nullable: true}
        classification: {type: string, nullable: true}
        issuer: {type: string, nullable: true}
        enclave_binding: {type: object, additionalProperties: true}
        quotas:
          type: object
          description: Node/session/tunnel quota pools with enforcement levels.
          additionalProperties: true
        modules:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: {type: string}
              entitled: {type: string, enum: [entitled, not_entitled]}
            additionalProperties: true
        account: {type: object, additionalProperties: true}
        status: {type: string, enum: [active, revoked]}
        effective_status: {type: string, enum: [active, revoked, expired]}
        algorithm: {type: string, enum: [RSA-PSS-SHA256, Ed25519]}
        signature_format: {type: string, enum: [json, jwt]}
        fingerprint: {type: string}
        days_until_expiry: {type: integer, nullable: true}
        revoked_at: {type: string, nullable: true}
        revoked_reason: {type: string, nullable: true}
        created_at: {type: string}
        usage: {$ref: "#/components/schemas/UsageSummary"}
        last_reported_at: {type: string, nullable: true}
        events:
          type: array
          description: Only on the detail endpoint.
          items: {$ref: "#/components/schemas/LicenseEvent"}

    LicenseEvent:
      type: object
      required: [id, license_key, action, created_at]
      properties:
        id: {type: integer}
        license_key: {type: string}
        action: {type: string}
        detail: {type: object, additionalProperties: true}
        created_at: {type: string}

    LicenseList:
      type: object
      required: [licenses, total, limit, offset]
      properties:
        licenses:
          type: array
          items: {$ref: "#/components/schemas/LicenseRecord"}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}

    ImportLicenseResponse:
      type: object
      required: [license, license_file, message]
      properties:
        license: {$ref: "#/components/schemas/LicenseRecord"}
        license_file: {$ref: "#/components/schemas/LicenseEnvelope"}
        token: {type: string, description: Compact token when the imported file was a jwt}
        message: {type: string}

    LicenseMutationResponse:
      type: object
      required: [license, message]
      properties:
        license: {$ref: "#/components/schemas/LicenseRecord"}
        message: {type: string}

    UsageReportRequest:
      type: object
      properties:
        nodes_consumed: {type: integer, minimum: 0}
        sessions_active: {type: integer, minimum: 0}
        bastion_tunnels_used: {type: integer, minimum: 0}
        pools:
          type: array
          items:
            type: object
            required: [id, nodes_consumed]
            properties:
              id: {type: string}
              nodes_consumed: {type: integer, minimum: 0}
            additionalProperties: false
      additionalProperties: false

    ValidationResult:
      type: object
      required: [valid, status, signature_valid, registered]
      properties:
        valid: {type: boolean}
        status:
          type: string
          enum: [valid, revoked, expired, malformed, signature_invalid]
        signature_valid: {type: boolean}
        registered: {type: boolean}
        revoked: {type: boolean}
        expired: {type: boolean}
        matches_registered_record: {type: [boolean, "null"]}
        reason: {type: [string, "null"]}
        license: {type: [object, "null"], additionalProperties: true}
        revoked_reason: {type: [string, "null"]}
        algorithm: {type: [string, "null"]}
        format: {type: [string, "null"]}
        fingerprint: {type: [string, "null"]}

    AccessCheck:
      type: object
      required: [license_key, status, active]
      properties:
        license_key: {type: string}
        license_id: {type: string, nullable: true}
        status: {type: string}
        active: {type: boolean}
        feature: {type: string}
        feature_allowed: {type: boolean}
        module_id: {type: string}
        module_allowed: {type: boolean}
        limit_type: {type: string}
        current_usage: {type: integer}
        limit: {type: [integer, "null"]}
        limit_allowed: {type: boolean}

    SettingsGroupValues:
      type: object
      description: Field -> value for one settings group (see the schema in GET /api/v1/settings).
      additionalProperties: true

    SettingsGroup:
      type: object
      required: [group, values, stored, updated_at, updated_by]
      properties:
        group: {type: string, enum: [sso, hsm, zsp, worm]}
        values: {$ref: "#/components/schemas/SettingsGroupValues"}
        stored: {type: boolean, description: "false = built-in defaults, never saved"}
        updated_at: {type: [string, "null"]}
        updated_by: {type: [string, "null"]}

    SettingsResponse:
      type: object
      required: [settings, schema]
      properties:
        settings:
          type: object
          properties:
            sso: {$ref: "#/components/schemas/SettingsGroup"}
            hsm: {$ref: "#/components/schemas/SettingsGroup"}
            zsp: {$ref: "#/components/schemas/SettingsGroup"}
            worm: {$ref: "#/components/schemas/SettingsGroup"}
        schema:
          type: object
          description: Per-group, per-field render schema (type, min/max, default, choices).
          additionalProperties: true

    SettingsWriteResponse:
      type: object
      required: [group, values, changes, changed_fields, message, updated_by]
      properties:
        group: {type: string}
        values: {$ref: "#/components/schemas/SettingsGroupValues"}
        changes:
          type: object
          description: Per-field old/new diff.
          additionalProperties:
            type: object
            properties:
              old: {}
              new: {}
        changed_fields: {type: array, items: {type: string}}
        message: {type: string, enum: [Settings stored, No changes]}
        updated_by: {type: string}

    SettingsAuditResponse:
      type: object
      required: [events, total, limit]
      properties:
        events:
          type: array
          items:
            type: object
            required: [id, group, action, changes, actor, created_at]
            properties:
              id: {type: integer}
              group: {type: string, enum: [sso, hsm, zsp, worm]}
              action: {type: string, enum: [updated]}
              changes:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    old: {}
                    new: {}
              actor: {type: string}
              created_at: {type: string}
        total: {type: integer}
        limit: {type: integer}

    # --- dashboard + credential vault -------------------------------------
    Overview:
      type: object
      required: [generated_at, health, licenses, vault, settings, counters, posture, activity]
      properties:
        generated_at: {type: string}
        health:
          type: object
          properties:
            status: {type: string, enum: [ok, degraded]}
            auth: {type: string, enum: [token, open]}
            algorithms: {type: array, items: {type: string}}
            formats: {type: array, items: {type: string}}
        licenses:
          type: object
          properties:
            total: {type: integer}
            active: {type: integer}
            revoked: {type: integer}
            expired: {type: integer}
            expiring_soon: {type: integer}
            by_tier: {type: object, additionalProperties: {type: integer}}
            usage:
              type: object
              properties:
                nodes: {type: integer}
                sessions: {type: integer}
                bastion_tunnels: {type: integer}
                reported_licenses: {type: integer}
        vault: {$ref: "#/components/schemas/VaultStats"}
        settings:
          type: object
          properties:
            groups: {type: integer}
            groups_stored: {type: integer}
            worm_retention_days: {type: integer}
            worm_immutable: {type: boolean}
            zsp_quorum_approvers: {type: integer}
            sso_provider: {type: string}
        counters:
          type: object
          properties:
            license_events: {type: integer}
            settings_events: {type: integer}
            vault_events: {type: integer}
            discovery_events: {type: integer}
            total_events: {type: integer}
        posture:
          type: object
          required: [score, violations, controls]
          properties:
            score: {type: number}
            violations: {type: integer}
            controls:
              type: array
              items:
                type: object
                required: [id, label, passed, evidence]
                properties:
                  id: {type: string}
                  label: {type: string}
                  passed: {type: boolean}
                  evidence: {type: string}
        activity:
          type: array
          items: {$ref: "#/components/schemas/UnifiedEvent"}

    UnifiedEvent:
      type: object
      required: [id, source, action, subject, actor, created_at, seq, event_hash]
      properties:
        id: {type: string, description: 'Source-prefixed id, e.g. "vault:12".'}
        seq: {type: integer, description: Position in the immutable hash chain.}
        source: {type: string, enum: [license, settings, vault, discovery, jit, session, command, risk]}
        action: {type: string}
        subject: {type: string, description: License key, settings group, vault item, JIT request, session ref, incident ref or risk subject}
        actor: {type: string}
        detail: {type: object, additionalProperties: true}
        created_at: {type: string}
        event_hash: {type: string, description: sha256 over this record and the previous hash.}

    EventFeed:
      type: object
      required: [events, total, limit, source]
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/UnifiedEvent"}
        total: {type: integer}
        limit: {type: integer}
        source: {type: string, enum: [license, settings, vault, discovery, jit, session, command, risk, all]}

    AuditStats:
      type: object
      required: [total, by_source, last_seq, head_hash, oldest_at, newest_at, trigger_protection]
      properties:
        total: {type: integer, description: Records in the ledger.}
        by_source:
          type: object
          description: Record count per source (all eight keys, zero-filled).
          additionalProperties: {type: integer}
        last_seq: {type: integer, description: Chain position of the newest record (0 when empty).}
        head_hash: {type: string, description: event_hash of the newest record ("" when empty).}
        oldest_at: {type: [string, "null"], description: Timestamp of the oldest record.}
        newest_at: {type: [string, "null"]}
        trigger_protection: {type: boolean, description: The append-only SQLite triggers are installed.}

    AuditVerify:
      type: object
      required: [intact, checked, total, last_seq, head_hash, broken_at, reason]
      properties:
        intact: {type: boolean, description: Every record re-hashed and linked correctly.}
        checked: {type: integer, description: Records verified before any break (all of them when intact).}
        total: {type: integer, description: Records walked.}
        last_seq: {type: integer}
        head_hash: {type: string}
        broken_at: {type: [integer, "null"], description: Chain position of the first break.}
        reason: {type: [string, "null"], description: Why the chain broke.}

    RiskEvaluateRequest:
      type: object
      required: [subject]
      properties:
        subject: {type: string, maxLength: 160, description: Who the score is about (user, account, service id).}
        target: {type: string, maxLength: 255, description: "Asset/host[:port] resolved against the discovered inventory."}
        device: {type: string, maxLength: 128, description: Client device identifier (known or unknown to discovery).}
        source_ip: {type: string, maxLength: 64, description: "Request source address, classified with stdlib ipaddress (no geo feed is claimed)."}
        ticket: {type: string, maxLength: 64, description: Change/incident reference (ITSM shape check).}
        command: {type: string, maxLength: 1000, description: Proposed command, judged by the live section-9 policy.}

    RiskComponent:
      type: object
      required: [component, points, detail]
      properties:
        component: {type: string, enum: [user, device, asset, time, location, behavior, ticket, command]}
        points: {type: integer, minimum: 0}
        detail: {type: string, description: The measured input that produced these points (0 points still explains why).}

    RiskEvaluation:
      type: object
      required: [id, created_at, actor, subject, context, target, device, source_ip,
                 ticket, command, score, band, decision, result, components]
      properties:
        id: {type: integer}
        created_at: {type: string, format: date-time}
        actor: {type: string, description: Who asked for the evaluation.}
        subject: {type: string}
        context: {type: string, enum: [manual, session_start]}
        target: {type: string}
        device: {type: string}
        source_ip: {type: string}
        ticket: {type: string}
        command: {type: string}
        score: {type: integer, minimum: 0, maximum: 100, description: Sum of the component points (the caps add up to exactly 100).}
        band: {type: string, enum: [low, medium, high, critical]}
        decision: {type: string, enum: [allow, mfa, approval, block], description: Policy action the band prescribes.}
        result: {type: string, enum: [advisory, allowed, refused], description: Console evaluations only advise; a session start was allowed or refused.}
        components: {type: array, items: {$ref: "#/components/schemas/RiskComponent"}}

    RiskEvaluateResponse:
      type: object
      required: [evaluation, message]
      properties:
        evaluation: {$ref: "#/components/schemas/RiskEvaluation"}
        message: {type: string}

    RiskEvaluationList:
      type: object
      required: [evaluations, total, limit, offset]
      properties:
        evaluations: {type: array, items: {$ref: "#/components/schemas/RiskEvaluation"}}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}

    RiskStats:
      type: object
      required: [total, by_band, by_decision, by_result, by_context, refused, avg_score, last_evaluated_at]
      properties:
        total: {type: integer}
        by_band: {type: object, additionalProperties: {type: integer}}
        by_decision: {type: object, additionalProperties: {type: integer}}
        by_result: {type: object, additionalProperties: {type: integer}}
        by_context: {type: object, additionalProperties: {type: integer}}
        refused: {type: integer, description: Evaluations whose band refused a session start.}
        avg_score: {type: [number, "null"], description: Mean score over all evaluations (null when there are none).}
        last_evaluated_at: {type: [string, "null"], format: date-time}

    VaultStats:
      type: object
      required: [total, by_type, by_status, rotation, secrets, attention, checked_out, events_today]
      properties:
        total: {type: integer}
        by_type: {type: object, additionalProperties: {type: integer}}
        by_status: {type: object, additionalProperties: {type: integer}}
        rotation:
          type: object
          properties:
            compliance_pct: {type: number}
            due: {type: integer}
            on_demand: {type: integer}
        secrets:
          type: object
          description: Real at-rest encryption coverage over the inventory.
          properties:
            managed: {type: integer, description: Items with a stored (encrypted) secret version.}
            unmanaged: {type: integer, description: Metadata-only records with no stored secret.}
            versions: {type: integer, description: Total secret version rows across all items.}
        attention:
          type: object
          properties:
            failed: {type: integer}
        checked_out: {type: integer}
        events_today:
          type: object
          properties:
            checkouts: {type: integer}
            rotations: {type: integer}

    VaultItem:
      type: object
      required: [id, name, secret_type, target, principal, rotation_interval_hours,
                 rotation_interval_label, status, created_at]
      properties:
        id: {type: integer}
        name: {type: string}
        secret_type:
          type: string
          enum: [database, cloud_iam, ssh_key, service_account, domain_password, api_token]
        description: {type: string}
        target: {type: string}
        target_detail: {type: string}
        principal: {type: string}
        access_tier: {type: string, enum: [Tier-0, Tier-1, Tier-2]}
        auth_method: {type: string}
        rotation_interval_hours: {type: integer, minimum: 0, maximum: 8760}
        rotation_interval_label: {type: string, description: "On-demand, Every 24h or Every 7d"}
        rotation_hours_remaining: {type: [integer, "null"]}
        last_rotated_at: {type: [string, "null"]}
        status: {type: string, enum: [available, checked_out, rotating, rotation_due, failed]}
        checked_out_by: {type: [string, "null"]}
        checked_out_at: {type: [string, "null"]}
        secret_version:
          type: [integer, "null"]
          description: Current stored secret version (null = metadata-only record).
        secret_updated_at: {type: [string, "null"]}
        created_at: {type: string}

    VaultItemList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/VaultItem"}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}

    VaultItemDetail:
      type: object
      required: [item]
      properties:
        item:
          allOf:
            - $ref: "#/components/schemas/VaultItem"
            - type: object
              properties:
                events:
                  type: array
                  items: {$ref: "#/components/schemas/VaultEvent"}

    VaultEvent:
      type: object
      required: [id, item_id, item_name, action, actor, created_at]
      properties:
        id: {type: integer}
        item_id: {type: integer}
        item_name: {type: string}
        action:
          type: string
          enum: [onboarded, checked_out, revoked, rotated, rotation_failed]
        actor: {type: string}
        detail: {type: object, additionalProperties: true}
        created_at: {type: string}

    VaultEventFeed:
      type: object
      required: [events, total, limit]
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/VaultEvent"}
        total: {type: integer}
        limit: {type: integer}
        action:
          type: string
          description: Echoed back when the `action` filter was applied.
          enum: [onboarded, checked_out, revoked, rotated, rotation_failed]

    VaultOnboardRequest:
      type: object
      required: [name, secret_type, target, principal]
      properties:
        name: {type: string, maxLength: 120}
        secret_type:
          type: string
          enum: [database, cloud_iam, ssh_key, service_account, domain_password, api_token]
        description: {type: string, maxLength: 255}
        target: {type: string, maxLength: 255}
        target_detail: {type: string, maxLength: 255}
        principal: {type: string, maxLength: 128}
        access_tier: {type: string, enum: [Tier-0, Tier-1, Tier-2], default: Tier-2}
        auth_method: {type: string, maxLength: 32, default: Password}
        rotation_interval_hours: {type: integer, minimum: 0, maximum: 8760, default: 24}
        secret:
          type: string
          maxLength: 65536
          description: |
            Optional operator-supplied credential value; when omitted the
            server generates a real type-appropriate secret (mixed-class
            password, urlsafe token, cloud pair or ED25519 key). Either way
            the value is sealed with AES-256-GCM before storage and never
            returned by list/detail endpoints.

    VaultActionResponse:
      type: object
      required: [item, message]
      properties:
        item: {$ref: "#/components/schemas/VaultItem"}
        message: {type: string}

    SecretReveal:
      type: object
      required: [item_id, item_name, version, secret, entropy_bits, alg, source, rotated_at]
      properties:
        item_id: {type: integer}
        item_name: {type: string}
        version: {type: integer}
        secret: {type: string, description: Decrypted plaintext (admin reveal only).}
        entropy_bits:
          type: integer
          description: Rough length x log2(charset) estimate of the revealed value (labelled `~` in the UI).
        alg: {type: string, enum: [AES-256-GCM]}
        source: {type: string, enum: [generated, operator]}
        rotated_at: {type: string, description: When this version was stored.}

    RotationDetail:
      type: object
      description: What one rotation actually did, measured during the run.
      required: [trigger, previous_status, interval_hours, secret_version, validation, dependents, duration_ms]
      properties:
        trigger: {type: string, enum: [manual, bulk, scheduled, session_end]}
        previous_status: {type: string, enum: [available, checked_out, rotating, rotation_due, failed]}
        interval_hours: {type: integer}
        secret_version: {type: integer}
        validation:
          type: object
          properties:
            method: {type: string, enum: [local_roundtrip]}
            passed: {type: boolean}
            checks:
              type: array
              items: {type: string, enum: [decrypt, plaintext_match, type_format]}
        dependents:
          type: object
          properties:
            considered: {type: integer}
            rotated: {type: array, items: {type: string}}
            skipped:
              type: array
              items:
                type: object
                properties:
                  name: {type: string}
                  reason: {type: string}
        duration_ms: {type: integer, description: Real wall-clock duration of the pipeline.}
        session_ref: {type: string, description: Present for the session-end trigger.}
        checkout_released: {type: boolean, description: "Session-end only: whether a checkout was released first."}

    RotationActionResponse:
      type: object
      required: [item, rotation, message]
      properties:
        item: {$ref: "#/components/schemas/VaultItem"}
        rotation: {$ref: "#/components/schemas/RotationDetail"}
        message: {type: string}

    RotationRunRequest:
      type: object
      properties:
        item_ids:
          type: array
          minItems: 1
          items: {type: integer, minimum: 1}
          description: Rotate exactly these ids; omit to run every due (and failed) credential.
        cascade:
          type: boolean
          default: true
          description: Also rotate the other managed credentials on each rotated item's target.

    RotationRunResponse:
      type: object
      required: [trigger, targets, rotated, skipped, failed, dependents_rotated, dependents_skipped, due_remaining, failed_remaining]
      properties:
        trigger: {type: string, enum: [bulk, scheduled]}
        targets: {type: integer, description: Items selected for this run.}
        rotated:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              secret_version: {type: integer}
              dependents: {type: integer}
        skipped:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              reason: {type: string}
        failed:
          type: array
          items:
            type: object
            properties:
              id: {type: integer}
              name: {type: string}
              error: {type: string}
        dependents_rotated: {type: integer}
        dependents_skipped:
          type: array
          description: Same-target dependents that could not rotate, with the real reason.
          items:
            type: object
            properties:
              name: {type: string}
              reason: {type: string}
        due_remaining: {type: integer}
        failed_remaining: {type: integer}

    # --- JIT / JEA access (module 6) -------------------------------------
    JitRiskFactor:
      type: object
      required: [factor, points, detail]
      properties:
        factor:
          type: string
          enum: [target_tier, duration, off_hours, repeat_requests, ticket_shape, credential_health]
        points: {type: integer, description: Real points this input contributed.}
        detail: {type: string}

    JitRisk:
      type: object
      required: [score, level, factors]
      properties:
        score: {type: integer, minimum: 0, maximum: 100}
        level: {type: string, enum: [low, medium, high, critical]}
        factors:
          type: array
          items: {$ref: "#/components/schemas/JitRiskFactor"}

    JitApproverSnapshot:
      type: object
      required: [actor, at]
      properties:
        actor: {type: string}
        at: {type: string}
        role: {type: string}

    JitRequest:
      type: object
      required: [id, item_id, requester, reason, ticket, minutes, risk, status, approvals, created_at]
      properties:
        id: {type: integer}
        item_id: {type: integer}
        requester: {type: string}
        reason: {type: string}
        ticket: {type: string}
        minutes: {type: integer, minimum: 1, maximum: 480}
        minutes_left:
          type: [integer, "null"]
          description: Remaining window in minutes for an active grant (null otherwise).
        risk: {$ref: "#/components/schemas/JitRisk"}
        status:
          type: string
          enum: [pending, approved, active, closed, expired, denied, blocked]
        approvals:
          type: object
          properties:
            manager: {type: [object, "null"], additionalProperties: true}
            security: {type: [object, "null"], additionalProperties: true}
        granted_at: {type: [string, "null"]}
        expires_at: {type: [string, "null"]}
        closed_at: {type: [string, "null"]}
        session_ref: {type: [string, "null"], description: "jit-<id> while granted."}
        created_at: {type: string}

    JitEvent:
      type: object
      required: [id, request_id, action, actor, detail, created_at]
      properties:
        id: {type: integer}
        request_id: {type: integer}
        action:
          type: string
          enum: [requested, approved, denied, granted, expired, closed, blocked]
        actor: {type: string}
        detail: {type: object, additionalProperties: true}
        created_at: {type: string}

    JitRequestList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/JitRequest"}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}

    JitRequestDetail:
      type: object
      required: [request, events]
      properties:
        request: {$ref: "#/components/schemas/JitRequest"}
        events:
          type: array
          items: {$ref: "#/components/schemas/JitEvent"}

    JitRequestResponse:
      type: object
      required: [request, message]
      properties:
        request: {$ref: "#/components/schemas/JitRequest"}
        message: {type: string}

    JitCreateRequest:
      type: object
      required: [item_id, reason, ticket]
      properties:
        item_id: {type: integer, minimum: 1}
        reason: {type: string, minLength: 8, maxLength: 255}
        ticket: {type: string, maxLength: 64, description: "ITSM reference such as INC-23891."}
        minutes: {type: integer, minimum: 1, maximum: 480, default: 15}
        requester:
          type: string
          maxLength: 64
          description: Defaults to the X-Actor header when omitted.

    JitApproveRequest:
      type: object
      required: [role]
      properties:
        role: {type: string, enum: [manager, security]}

    JitDenyRequest:
      type: object
      properties:
        reason: {type: string, maxLength: 255}

    JitStats:
      type: object
      required: [total, by_status, by_risk, active, pending]
      properties:
        total: {type: integer}
        by_status:
          type: object
          additionalProperties: {type: integer}
        by_risk:
          type: object
          additionalProperties: {type: integer}
        active: {type: integer}
        pending: {type: integer}

    # --- privileged session management (module 8) ------------------------
    SessionProtocol:
      type: string
      enum: [ssh, rdp, telnet, vnc, http, https, sql, oracle, postgresql, mssql, mysql, sap, kubernetes]

    SessionStatus:
      type: string
      enum: [active, paused, locked, terminated, completed]

    SessionEventType:
      type: string
      enum: [keystroke, command, file_upload, file_download, clipboard, screenshot, note, status, approval]

    SessionControls:
      type: object
      required: [record, keystroke_log, watermark, clipboard_allowed, upload_allowed, download_allowed, screenshot_allowed]
      properties:
        record: {type: boolean}
        keystroke_log: {type: boolean}
        watermark: {type: boolean}
        clipboard_allowed: {type: boolean}
        upload_allowed: {type: boolean}
        download_allowed: {type: boolean}
        screenshot_allowed: {type: boolean}

    Session:
      type: object
      required: [id, session_ref, protocol, target, actor, status, controls, started_at, duration_seconds, created_at]
      properties:
        id: {type: integer}
        session_ref: {type: string, description: "sess-<hex>, the custody ref used in watermarks and rotation events."}
        protocol: {$ref: "#/components/schemas/SessionProtocol"}
        target: {type: string}
        actor: {type: string}
        item_id: {type: [integer, "null"], description: Vault credential the session runs against, if any.}
        jit_request_id: {type: [integer, "null"], description: Active JIT grant the session rides, if any.}
        status: {$ref: "#/components/schemas/SessionStatus"}
        controls: {$ref: "#/components/schemas/SessionControls"}
        started_at: {type: string}
        ended_at: {type: [string, "null"]}
        end_reason: {type: [string, "null"], enum: [terminated, completed, grant_expired, grant_closed, null]}
        duration_seconds: {type: integer, description: Real wall-clock length (live sessions count to now).}
        created_at: {type: string}

    SessionEvent:
      type: object
      required: [id, session_id, seq, type, content, allowed, blocked_reason, withheld, decision, rule_id, ref_seq, watermark, actor, created_at]
      properties:
        id: {type: integer}
        session_id: {type: integer}
        seq: {type: integer, description: Monotonic playback position within the session.}
        type: {$ref: "#/components/schemas/SessionEventType"}
        content: {type: [string, "null"], description: Null when keystroke logging withheld the input.}
        allowed: {type: boolean, description: False when a control or the command policy blocked the action (kept as evidence).}
        blocked_reason: {type: [string, "null"], enum: [upload_not_allowed, download_not_allowed, clipboard_not_allowed, screenshot_not_allowed, approval_required, command_blocked, approval_denied, null]}
        withheld: {type: boolean}
        decision: {type: [string, "null"], enum: [allow, approval, block, approved, denied, null], description: Command-control decision (command rows) or resolution (approval rows).}
        rule_id: {type: [integer, "null"], description: Rule that decided; null when no rule matched (default allow).}
        ref_seq: {type: [integer, "null"], description: "On approval rows: seq of the held command this resolves."}
        watermark: {type: [string, "null"]}
        actor: {type: string}
        created_at: {type: string}

    SessionList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Session"}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}

    SessionDetail:
      type: object
      required: [session, events, event_count, blocked_count]
      properties:
        session: {$ref: "#/components/schemas/Session"}
        events:
          type: array
          description: Latest 20 events, newest first.
          items: {$ref: "#/components/schemas/SessionEvent"}
        event_count: {type: integer}
        blocked_count: {type: integer}

    SessionEventList:
      type: object
      required: [events, total, limit, offset]
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/SessionEvent"}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}

    SessionResponse:
      type: object
      required: [session, message]
      properties:
        session: {$ref: "#/components/schemas/Session"}
        risk:
          {$ref: "#/components/schemas/RiskEvaluation"}
        message: {type: string}

    SessionEventResponse:
      type: object
      required: [event, message]
      properties:
        event: {$ref: "#/components/schemas/SessionEvent"}
        message: {type: string}
        escalation:
          type: object
          additionalProperties: true
          description: Present when an escalated command block terminated the session (the incident and its release-and-rotate cascade).

    SessionEndResponse:
      type: object
      required: [session, cascade, message]
      properties:
        session: {$ref: "#/components/schemas/Session"}
        cascade:
          type: object
          additionalProperties: true
          description: Release-and-rotate outcome (session_ref, rotated, checkout_released, secret_version or rotation_error).
        message: {type: string}

    SessionStartRequest:
      type: object
      required: [protocol, target]
      properties:
        protocol: {$ref: "#/components/schemas/SessionProtocol"}
        target: {type: string, maxLength: 255}
        item_id: {type: integer, minimum: 1, description: Vault credential to check out for the session.}
        jit_request_id: {type: integer, minimum: 1, description: Active JIT grant to attach to instead.}
        device:
          type: string
          maxLength: 128
          description: Client device identifier, scored by the risk engine at start (unknown devices cost points).
        record: {type: boolean, default: true}
        keystroke_log: {type: boolean, default: true}
        watermark: {type: boolean, default: true}
        clipboard_allowed: {type: boolean, default: true}
        upload_allowed: {type: boolean, default: true}
        download_allowed: {type: boolean, default: true}
        screenshot_allowed: {type: boolean, default: true}

    SessionEventPost:
      type: object
      required: [type]
      properties:
        type: {$ref: "#/components/schemas/SessionEventType"}
        content: {type: string, maxLength: 4096}

    SessionControlsUpdate:
      type: object
      minProperties: 1
      properties:
        record: {type: boolean}
        keystroke_log: {type: boolean}
        watermark: {type: boolean}
        clipboard_allowed: {type: boolean}
        upload_allowed: {type: boolean}
        download_allowed: {type: boolean}
        screenshot_allowed: {type: boolean}

    SessionEndRequest:
      type: object
      properties:
        reason: {type: string, maxLength: 500}

    SessionStats:
      type: object
      required: [total, by_status, active, paused, locked, ended, events_total, events_blocked, events_withheld]
      properties:
        total: {type: integer}
        by_status:
          type: object
          additionalProperties: {type: integer}
        active: {type: integer}
        paused: {type: integer}
        locked: {type: integer}
        ended: {type: integer}
        events_total: {type: integer}
        events_blocked: {type: integer}
        events_withheld: {type: integer}

    # --- command control (module 9) ----------------------------------------
    CommandAction:
      type: string
      enum: [allow, approval, block]

    CommandRule:
      type: object
      required: [id, name, pattern, action, target_pattern, terminate_on_match, description, enabled, created_at, updated_at, updated_by]
      properties:
        id: {type: integer}
        name: {type: string}
        pattern: {type: string, description: Case-insensitive substring matched against the command line.}
        action: {$ref: "#/components/schemas/CommandAction"}
        target_pattern: {type: string, description: "fnmatch glob on the session target, case-insensitive; empty string = any target."}
        terminate_on_match: {type: boolean, description: "Context-aware escalation: a matching block also ends the session and raises an incident."}
        description: {type: string}
        enabled: {type: boolean}
        created_at: {type: string}
        updated_at: {type: string}
        updated_by: {type: string}
        match_count: {type: integer, description: Recorded events this rule decided (list responses only).}

    CommandRuleRequest:
      type: object
      description: Create (name and pattern required) or partial update payload.
      properties:
        name: {type: string, maxLength: 120}
        pattern: {type: string, maxLength: 160}
        action: {$ref: "#/components/schemas/CommandAction"}
        target_pattern: {type: string, maxLength: 120}
        terminate_on_match: {type: boolean, description: Refused unless action is block.}
        description: {type: string, maxLength: 255}
        enabled: {type: boolean}

    CommandRuleList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CommandRule"}
        total: {type: integer}

    CommandRuleResponse:
      type: object
      required: [rule, message]
      properties:
        rule: {$ref: "#/components/schemas/CommandRule"}
        message: {type: string}

    CommandRuleDeleteResponse:
      type: object
      required: [deleted, message]
      properties:
        deleted: {type: integer}
        message: {type: string}

    CommandEvaluateRequest:
      type: object
      required: [command]
      properties:
        command: {type: string, maxLength: 4096}
        target: {type: string, maxLength: 255, description: Session target the rule scopes apply to.}

    CommandDecision:
      type: object
      required: [decision, matched, terminate, rule, default]
      properties:
        decision: {$ref: "#/components/schemas/CommandAction"}
        matched: {type: boolean}
        terminate: {type: boolean, description: True when the deciding rule escalates (posting this command would end the session).}
        rule:
          oneOf:
            - {$ref: "#/components/schemas/CommandRule"}
            - type: "null"
          description: The deciding rule; null when nothing matched.
        default: {type: boolean, description: True when no rule matched (default allow).}

    CommandEvaluateResponse:
      type: object
      required: [result]
      properties:
        result: {$ref: "#/components/schemas/CommandDecision"}

    CommandApproval:
      type: object
      required: [event, session]
      properties:
        event: {$ref: "#/components/schemas/SessionEvent"}
        session:
          type: object
          required: [id, session_ref, protocol, target, actor, status]
          properties:
            id: {type: integer}
            session_ref: {type: string}
            protocol: {$ref: "#/components/schemas/SessionProtocol"}
            target: {type: string}
            actor: {type: string}
            status: {$ref: "#/components/schemas/SessionStatus"}

    CommandApprovalList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CommandApproval"}
        total: {type: integer}

    CommandApprovalResponse:
      type: object
      required: [event, resolution, message]
      properties:
        event: {$ref: "#/components/schemas/SessionEvent", description: The held command this decision resolves.}
        resolution: {$ref: "#/components/schemas/SessionEvent", description: The appended approval row (ref_seq -> the hold).}
        message: {type: string}

    CommandIncident:
      type: object
      required: [id, incident_ref, session_id, event_seq, rule_id, rule_name, rule_pattern, command, target, actor, status, closed_by, closed_at, close_note, created_at]
      properties:
        id: {type: integer}
        incident_ref: {type: string, description: "inc-<hex>, the incident's custody ref."}
        session_id: {type: integer}
        event_seq: {type: integer, description: Seq of the blocked command this preserves.}
        rule_id: {type: [integer, "null"]}
        rule_name: {type: string, description: Snapshot so evidence survives rule edits/deletes.}
        rule_pattern: {type: string}
        command: {type: string}
        target: {type: string}
        actor: {type: string}
        status: {type: string, enum: [open, closed]}
        closed_by: {type: [string, "null"]}
        closed_at: {type: [string, "null"]}
        close_note: {type: string}
        created_at: {type: string}

    CommandIncidentList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/CommandIncident"}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}

    CommandIncidentResponse:
      type: object
      required: [incident]
      properties:
        incident: {$ref: "#/components/schemas/CommandIncident"}
        message: {type: string}

    CommandIncidentCloseRequest:
      type: object
      properties:
        note: {type: string, maxLength: 255}

    CommandStats:
      type: object
      required: [rules_total, rules_enabled, by_action, intercepts_today, commands_today, commands_recorded, approvals, incidents, engine_hash, last_sync, last_sync_by]
      properties:
        rules_total: {type: integer}
        rules_enabled: {type: integer}
        by_action:
          type: object
          additionalProperties: {type: integer}
        intercepts_today: {type: integer, description: Command events decided block since local midnight.}
        commands_today: {type: integer, description: Command events recorded since local midnight.}
        commands_recorded: {type: integer, description: Command events recorded all-time.}
        approvals:
          type: object
          required: [pending, approved, denied]
          properties:
            pending: {type: integer}
            approved: {type: integer}
            denied: {type: integer}
        incidents:
          type: object
          required: [open, total]
          properties:
            open: {type: integer}
            total: {type: integer}
        engine_hash: {type: string, description: First 12 hex chars of sha256 over the canonical policy.}
        last_sync: {type: [string, "null"], description: Most recent rule update (ISO 8601).}
        last_sync_by: {type: [string, "null"], description: Actor on the most recently updated rule.}

    # --- discovery engine (module 3) -------------------------------------
    DiscoveryAssetType:
      type: string
      enum: [windows, linux, unix, aix, solaris, vmware, hyperv, kubernetes, docker, network, firewall, loadbalancer, database, cloud, unknown]
    DiscoveryRisk:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]
    DiscoveryPamStatus:
      type: string
      enum: [unmanaged, managed, ignored]

    DiscoveredAsset:
      type: object
      required: [id, address, asset_type, risk, pam_status, ports, source, method, recommended_policy, first_seen, last_seen]
      properties:
        id: {type: integer}
        address: {type: string, description: "IP or hostname as probed / registered."}
        hostname: {type: string}
        asset_type: {$ref: "#/components/schemas/DiscoveryAssetType"}
        risk: {$ref: "#/components/schemas/DiscoveryRisk"}
        pam_status: {$ref: "#/components/schemas/DiscoveryPamStatus"}
        detail: {type: string, description: "Probed service labels or greeting text (real probe output)."}
        ports:
          type: array
          description: Open ports found by the real TCP-connect probe.
          items:
            type: object
            required: [port, proto]
            properties:
              port: {type: integer}
              proto: {type: string, enum: [TCP]}
              service: {type: string}
              banner: {type: string, description: "Greeting captured during the banner grab (empty when the service stayed silent)."}
        source: {type: string, enum: [scan, manual]}
        method: {type: string, enum: [tcp_probe, manual]}
        notes: {type: string}
        recommended_policy: {type: string, description: "Advisory policy for this asset family (rules v1), never auto-enforced."}
        vault_count: {type: [integer, "null"], description: "Vault credentials whose target matches this address; present in list responses."}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}

    DiscoveredAssetList:
      type: object
      required: [assets, total, limit, offset]
      properties:
        assets:
          type: array
          items: {$ref: "#/components/schemas/DiscoveredAsset"}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}

    DiscoveredAccount:
      type: object
      required: [id, asset_id, asset_address, username, kind, source, created_at]
      properties:
        id: {type: integer}
        asset_id: {type: integer}
        asset_address: {type: string}
        username: {type: string}
        kind: {type: string, enum: [builtin_admin, database_admin, service_account, other]}
        source: {type: string, enum: [scan, manual]}
        created_at: {type: string, format: date-time}

    DiscoveredAccountList:
      type: object
      required: [accounts, total, limit, offset]
      properties:
        accounts:
          type: array
          items: {$ref: "#/components/schemas/DiscoveredAccount"}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}

    DiscoveryScan:
      type: object
      required: [id, scope, method, ports, status, hosts_probed, hosts_open, services_found, findings, triggered_by, started_at]
      properties:
        id: {type: integer}
        scope: {type: string, description: "IPv4, CIDR or hostname actually scanned."}
        method: {type: string, enum: [tcp_probe]}
        ports: {type: array, items: {type: integer}}
        status: {type: string, enum: [running, completed, failed]}
        hosts_probed: {type: integer}
        hosts_open: {type: integer}
        services_found: {type: integer}
        findings: {type: integer, description: "Hosts with open ports that were new to the inventory."}
        error: {type: string}
        triggered_by: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, "null"], format: date-time}

    DiscoveryScanList:
      type: object
      required: [scans, total, limit]
      properties:
        scans:
          type: array
          items: {$ref: "#/components/schemas/DiscoveryScan"}
        total: {type: integer}
        limit: {type: integer}

    DiscoveryStats:
      type: object
      required: [total, by_type, by_risk, by_pam_status, accounts_total, scans]
      properties:
        total: {type: integer}
        by_type: {type: object, additionalProperties: {type: integer}}
        by_risk: {type: object, additionalProperties: {type: integer}}
        by_pam_status: {type: object, additionalProperties: {type: integer}}
        accounts_total: {type: integer}
        scans:
          type: object
          required: [total, last]
          properties:
            total: {type: integer}
            last: {type: [object, "null"], additionalProperties: true}

    DiscoveryOnboardRequest:
      type: object
      required: [address, principal]
      properties:
        address: {type: string, maxLength: 64, description: "Single IPv4 address or hostname (not a CIDR)."}
        hostname: {type: string, maxLength: 255}
        asset_type: {$ref: "#/components/schemas/DiscoveryAssetType"}
        detail: {type: string, maxLength: 255}
        notes: {type: string, maxLength: 255}
        principal: {type: string, maxLength: 128, description: "Privileged account ingested into the vault."}
        access_tier: {type: string, enum: [Tier-0, Tier-1, Tier-2], default: Tier-2}
        auth_method: {type: string, maxLength: 32, default: Password}
        rotation_interval_hours: {type: integer, minimum: 0, maximum: 8760, default: 24}

    DiscoveryAdoptRequest:
      type: object
      required: [principal]
      properties:
        principal: {type: string, maxLength: 128}
        access_tier: {type: string, enum: [Tier-0, Tier-1, Tier-2], default: Tier-2}
        auth_method: {type: string, maxLength: 32, default: Password}
        rotation_interval_hours: {type: integer, minimum: 0, maximum: 8760, default: 24}

    DiscoveryAssetPatch:
      type: object
      description: At least one effective change is required (400 otherwise).
      properties:
        pam_status: {$ref: "#/components/schemas/DiscoveryPamStatus"}
        asset_type: {$ref: "#/components/schemas/DiscoveryAssetType"}
        hostname: {type: string, maxLength: 255}
        detail: {type: string, maxLength: 255}
        notes: {type: string, maxLength: 255}

    DiscoveryScanRequest:
      type: object
      required: [scope]
      properties:
        scope: {type: string, maxLength: 64, description: "IPv4 address, IPv4 CIDR (max 256 hosts) or hostname. No default scope - only what the operator supplies."}
        ports:
          type: array
          maxItems: 24
          description: Defaults to the standard management-plane port set.
          items: {type: integer, minimum: 1, maximum: 65535}

    DiscoveryActionResponse:
      type: object
      required: [asset, message]
      properties:
        asset: {$ref: "#/components/schemas/DiscoveredAsset"}
        vault_item: {type: [object, "null"], additionalProperties: true, description: "Metadata-only vault credential created at onboarding (absent on patch)."}
        message: {type: string}

    DiscoveryScanResponse:
      type: object
      required: [scan, message]
      properties:
        scan: {$ref: "#/components/schemas/DiscoveryScan"}
        message: {type: string}

    BypassIngestRequest:
      type: object
      required: [origin, content]
      properties:
        origin: {type: string, maxLength: 128, description: "Where the bundle came from (file name or api label) - duplicate detection is per origin."}
        target: {type: string, maxLength: 255, description: "Host the OpenSSH lines belong to (the log's own machine); JSON lines may carry their own target instead."}
        content: {type: string, maxLength: 200000, description: "Raw log text - one entry per line, OpenSSH `Accepted ...` or a JSON object per line."}

    BypassIngestResult:
      type: object
      required: [origin, target, lines, parsed, stored, malformed, untargeted, duplicates]
      properties:
        origin: {type: string}
        target: {type: string}
        lines: {type: integer, description: Lines submitted.}
        parsed: {type: integer, description: Lines that yielded a structured observation.}
        stored: {type: integer, description: New signal rows written.}
        malformed: {type: integer, description: Lines that could not be parsed - counted, never invented.}
        untargeted: {type: integer, description: Parsed lines with no target to correlate against.}
        duplicates: {type: integer, description: Lines already stored for this origin.}

    BypassIngestResponse:
      type: object
      required: [ingest, message]
      properties:
        ingest: {$ref: "#/components/schemas/BypassIngestResult"}
        message: {type: string}

    BypassSignal:
      type: object
      required: [id, created_at, observed_at, user, source_ip, target, protocol,
                 origin, raw, status, detail]
      properties:
        id: {type: integer}
        created_at: {type: string, format: date-time}
        observed_at: {type: string, format: date-time, description: "The line's own timestamp when it carried one (detail.at_source=line), else the ingest time."}
        user: {type: string}
        source_ip: {type: string}
        target: {type: string}
        protocol: {type: string, description: "ssh for OpenSSH lines; whatever the structured record declared, else unknown."}
        origin: {type: string}
        raw: {type: string, description: The original log line, kept verbatim as evidence.}
        status: {type: string, enum: [observed, candidate, covered, out_of_scope]}
        detail: {type: object, additionalProperties: true, description: "Correlation notes: reason, matched asset, covering session, at_source."}

    BypassSignalList:
      type: object
      required: [signals, total, limit, offset]
      properties:
        signals: {type: array, items: {$ref: "#/components/schemas/BypassSignal"}}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}

    BypassScanResult:
      type: object
      required: [scanned, covered, out_of_scope, candidates, incidents, rotations_forced]
      properties:
        scanned: {type: integer, description: Signals correlated (previously `observed`).}
        covered: {type: integer, description: Signals matched to a recorded privileged session.}
        out_of_scope: {type: integer, description: Signals whose target is not a managed PAM asset.}
        candidates: {type: integer, description: Managed target, no covering session.}
        incidents: {type: integer, description: New incidents opened.}
        rotations_forced: {type: integer, description: Incidents whose forced rotation actually ran.}

    BypassScanResponse:
      type: object
      required: [scan, message]
      properties:
        scan: {$ref: "#/components/schemas/BypassScanResult"}
        message: {type: string}

    BypassIncidentActions:
      type: object
      description: The architecture's ACTION block as it actually resolved.
      properties:
        alert: {type: object, additionalProperties: true, description: "SOC alert = the ledger record under source `bypass`."}
        rotation: {type: object, additionalProperties: true, description: "Forced rotation outcome: rotated items with their new version, skipped/failed entries, or no_credential_on_file."}
        block_source: {type: object, additionalProperties: true, description: "Honest state: not_connected until a firewall/EDR enforcement connector exists."}

    BypassIncident:
      type: object
      required: [id, incident_ref, signal_id, user, source_ip, target, protocol,
                 observed_at, status, actions, closed_by, closed_at, close_note, created_at]
      properties:
        id: {type: integer}
        incident_ref: {type: string, example: byp-1a2b3c4d}
        signal_id: {type: integer, description: The evidence signal behind this incident.}
        user: {type: string}
        source_ip: {type: string}
        target: {type: string}
        protocol: {type: string}
        observed_at: {type: [string, "null"], format: date-time}
        status: {type: string, enum: [open, closed]}
        actions: {$ref: "#/components/schemas/BypassIncidentActions"}
        closed_by: {type: [string, "null"]}
        closed_at: {type: [string, "null"], format: date-time}
        close_note: {type: string}
        created_at: {type: string, format: date-time}

    BypassIncidentList:
      type: object
      required: [incidents, total, limit, offset]
      properties:
        incidents: {type: array, items: {$ref: "#/components/schemas/BypassIncident"}}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}

    BypassIncidentResponse:
      type: object
      required: [incident, evidence]
      properties:
        incident: {$ref: "#/components/schemas/BypassIncident"}
        evidence:
          oneOf:
            - {$ref: "#/components/schemas/BypassSignal"}
            - type: "null"
          description: The parsed log line behind the incident (null if it was deleted).

    BypassIncidentCloseRequest:
      type: object
      properties:
        note: {type: string, maxLength: 255, description: Why the incident was closed.}

    BypassIncidentCloseResponse:
      type: object
      required: [incident, message]
      properties:
        incident: {$ref: "#/components/schemas/BypassIncident"}
        message: {type: string}

    BypassStats:
      type: object
      required: [signals, incidents, rotations_forced, actions, last_ingest_at, last_scan_at]
      properties:
        signals: {type: object, additionalProperties: {type: integer}, description: "Counts per signal status plus the total."}
        incidents: {type: object, additionalProperties: {type: integer}, description: "total / open / closed."}
        rotations_forced: {type: integer, description: Incidents whose forced rotation actually ran.}
        actions: {type: object, additionalProperties: {type: integer}, description: "Ledger action counts: ingested / scanned / detected / closed."}
        last_ingest_at: {type: [string, "null"], format: date-time}
        last_scan_at: {type: [string, "null"], format: date-time}
