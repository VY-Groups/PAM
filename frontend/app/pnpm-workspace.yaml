# pnpm 12 supply-chain: pin the transitive packages that the audit gate fails
# on to their patched versions (fast-uri 3.1.9, undici 7.30.1 / 8.12.2).
overrides:
  fast-uri: 3.1.9
  undici@7: 7.30.1
  undici@8: 8.12.2

# pnpm 12 supply-chain: packages published too recently for the default
# minimum-release-age gate (pinned versions; CI runs with the same file).
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.2'
  - '@typescript-eslint/parser@8.71.2'
  - '@typescript-eslint/project-service@8.71.2'
  - '@typescript-eslint/scope-manager@8.71.2'
  - '@typescript-eslint/tsconfig-utils@8.71.2'
  - '@typescript-eslint/type-utils@8.71.2'
  - '@typescript-eslint/types@8.71.2'
  - '@typescript-eslint/typescript-estree@8.71.2'
  - '@typescript-eslint/utils@8.71.2'
  - '@typescript-eslint/visitor-keys@8.71.2'
  - '@vitest/mocker@5.0.4'
  - '@vitest/spy@5.0.4'
  - typescript-eslint@8.71.2
  - vitest@5.0.4
  - '@vitest/browser-playwright@5.0.4'
  - '@vitest/browser@5.0.4'
  - '@vitest/coverage-v8@5.0.4'
  - '@vitest/pretty-format@5.0.4'
  - '@vitest/ui@5.0.4'
  - '@vitest/utils@5.0.4'
  - i18next@26.4.4
  - zod@4.6.7

# pnpm 12 blocks dependency install scripts by default; esbuild's postinstall
# fetches/validates its native binary (Vite + Storybook use it).
allowBuilds:
  esbuild: true
