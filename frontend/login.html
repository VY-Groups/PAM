<title>VY-PAM Console</title>

:"1.5rem","space-sm":"0.5rem"},"fontFamily":{"headline-xl-mobile":["Geist"],"code-sm":["JetBrains Mono"],"body-md":["Geist"],"code-md":["JetBrains Mono"],"headline-sm":["Geist"],"headline-lg":["Geist"],"body-lg":["Geist"],"headline-md":["Geist"],"label-badge":["JetBrains Mono"],"headline-xl":["Geist"],"label-md":["Geist"],"body-sm":["Geist"]},"fontSize":{"headline-xl-mobile":["26px",{"lineHeight":"34px","letterSpacing":"-0.015em","fontWeight":"600"}],"code-sm":["11px",{"lineHeight":"16px","fontWeight":"500"}],"body-md":["14px",{"lineHeight":"20px","fontWeight":"400"}],"code-md":["13px",{"lineHeight":"20px","fontWeight":"500"}],"headline-sm":["16px",{"lineHeight":"24px","letterSpacing":"-0.005em","fontWeight":"600"}],"headline-lg":["24px",{"lineHeight":"32px","letterSpacing":"-0.015em","fontWeight":"600"}],"body-lg":["15px",{"lineHeight":"24px","fontWeight":"400"}],"headline-md":["20px",{"lineHeight":"28px","letterSpacing":"-0.01em","fontWeight":"600"}],"label-badge":["11px",{"lineHeight":"14px","letterSpacing":"0.02em","fontWeight":"600"}],"headline-xl":["32px",{"lineHeight":"40px","letterSpacing":"-0.02em","fontWeight":"600"}],"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.01em","fontWeight":"500"}],"body-sm":["12px",{"lineHeight":"18px","fontWeight":"400"}]}}}}</script>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center px-space-xl font-body-md text-body-md">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 p-space-xl flex flex-col gap-space-lg">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-[28px]">shield_lock</span>
<div class="flex flex-col">
<h1 class="font-headline-sm text-headline-sm text-on-surface">VY-PAM Console</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Privileged access management - sign in</p>
</div>
</div>
<div id="stepUser" class="flex flex-col gap-space-md">
<label class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-surface-variant">Username</span>
<input id="username" autocomplete="username" type="text" class="w-full px-3 py-2 rounded bg-surface-container-lowest text-on-surface font-body-md text-body-md border border-outline-variant/40 focus:outline-none focus:ring-1 focus:ring-primary-container"/>
</label>
<label class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-surface-variant">Password</span>
<input id="password" autocomplete="current-password" type="password" class="w-full px-3 py-2 rounded bg-surface-container-lowest text-on-surface font-body-md text-body-md border border-outline-variant/40 focus:outline-none focus:ring-1 focus:ring-primary-container"/>
</label>
<button id="btnSignIn" class="w-full py-2 rounded-lg bg-primary text-on-primary font-label-md text-label-md font-semibold hover:bg-primary-container transition-colors">Sign in</button>
</div>
<div id="stepMfa" class="hidden flex flex-col gap-space-md">
<p class="font-body-sm text-body-sm text-on-surface-variant">Multi-factor verification required. Enter the TOTP code from your authenticator, or a backup code.</p>
<input id="mfaCode" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="123456" class="w-full px-3 py-2 rounded bg-surface-container-lowest text-on-surface font-code-md text-code-md tracking-widest border border-outline-variant/40 focus:outline-none focus:ring-1 focus:ring-primary-container"/>
<button id="btnVerify" class="w-full py-2 rounded-lg bg-primary text-on-primary font-label-md text-label-md font-semibold hover:bg-primary-container transition-colors">Verify</button>
<button id="btnBack" class="w-full py-1.5 rounded-lg bg-surface-container text-on-surface font-label-md text-label-md font-semibold hover:bg-surface-container-high transition-colors">Back</button>
</div>
<div id="loginError" class="hidden font-body-sm text-body-sm text-error"></div>
<p id="fileNote" class="hidden font-body-sm text-body-sm text-on-surface-variant">Login requires the VY-PAM license server - open this screen from the server, not as a file.</p>
</div>
<footer class="fixed bottom-0 left-0 right-0 h-10 bg-surface-container-lowest/95 backdrop-blur-sm border-t border-outline-variant/30 z-30 flex items-center justify-between px-space-xl text-on-surface-variant font-code-sm text-code-sm">
<div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-tertiary"></span><span id="footServer" class="text-on-surface font-medium">License server: -</span></div>
<span id="footAuth">Auth: -</span>
</footer>
<script>
// Console login wiring (frontend-completion phase): the only identity source
// is POST /api/v1/auth/login. A live session is stored once and the console
// enters the launcher; MFA and enrolment are honoured honestly, never skipped.
(function () {
  var ROOT = location.protocol === 'file:' ? '' : '/';
  var API = ROOT + 'api/v1';
  var TOKEN_KEY = 'aegispam_admin_token';
  var CSRF_KEY = 'aegispam_admin_csrf';
  var FILE_MODE = ROOT === '';
  var challenge = null;
  var creds = null;

  function f(id) { return document.getElementById(id); }
  function put(el, t) { if (el) el.textContent = t; }
  function show(el, on) { if (el) el.classList.toggle('hidden', !on); }
  function showError(msg) {
    var el = f('loginError');
    if (!el) return;
    el.textContent = msg || '';
    show(el, !!msg);
  }

  function postLogin(body) {
    return fetch(API + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().catch(function () { return {}; }).then(function (data) {
        return { ok: res.ok, status: res.status, data: data };
      });
    });
  }

  function storeAndEnter(session) {
    sessionStorage.setItem(TOKEN_KEY, session.session_token);
    if (session.csrf_token) sessionStorage.setItem(CSRF_KEY, session.csrf_token);
    location.replace('./index.html');
  }

  function handle(body) {
    return postLogin(body).then(function (r) {
      var d = r.data || {};
      if (r.ok && d.session_token) { storeAndEnter(d); return; }
      if (r.status === 403 && d.status === 'mfa_required') {
        challenge = d.challenge;
        creds = { username: body.username, password: body.password };
        showError('');
        show(f('stepUser'), false);
        show(f('stepMfa'), true);
        var m = f('mfaCode');
        if (m) m.focus();
        return;
      }
      if (r.status === 403 && d.status === 'enrolment_required') {
        showError('Account not yet enrolled (' + (d.methods_allowed || []).join(', ')
          + '): an enrolment ticket is required - fail-closed, no silent pass.');
        return;
      }
      showError(d.error || ('Login refused (' + r.status + ').'));
    }).catch(function (err) {
      showError('Cannot reach the license server: ' + err.message);
    });
  }

  function signIn() {
    var u = f('username') ? f('username').value.trim() : '';
    var p = f('password') ? f('password').value : '';
    if (!u || !p) { showError('Username and password are required.'); return; }
    showError('');
    handle({ username: u, password: p });
  }

  function verifyMfa() {
    var code = f('mfaCode') ? f('mfaCode').value.trim() : '';
    if (!code || !creds) { showError('Enter the verification code.'); return; }
    showError('');
    handle({
      username: creds.username, password: creds.password,
      login_challenge: challenge, totp_code: code
    });
  }

  function fillFooter() {
    if (FILE_MODE) return;
    fetch(ROOT + 'health').then(function (r) { return r.json(); }).then(function (d) {
      put(f('footServer'), 'License server: ' + (d && d.status === 'ok' ? 'Healthy' : 'unreachable'));
      put(f('footAuth'), 'Auth: ' + (d && d.auth ? d.auth : '-'));
    }).catch(function () { put(f('footServer'), 'License server: not connected'); });
  }

  function boot() {
    if (!FILE_MODE && sessionStorage.getItem(TOKEN_KEY)) {
      location.replace('./index.html');
      return;
    }
    show(f('fileNote'), FILE_MODE);
    fillFooter();
    var el;
    el = f('btnSignIn'); if (el) el.addEventListener('click', signIn);
    el = f('btnVerify'); if (el) el.addEventListener('click', verifyMfa);
    el = f('btnBack'); if (el) el.addEventListener('click', function () {
      show(f('stepMfa'), false);
      show(f('stepUser'), true);
      showError('');
    });
    ['username', 'password', 'mfaCode'].forEach(function (id) {
      var i = f(id);
      if (i) i.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { if (id === 'mfaCode') verifyMfa(); else signIn(); }
      });
    });
  }
  boot();
})();
</script>
</body>
</html>
