# VY-PAM continuous integration - roadmap item A6 part 1.
#
# Every command in this workflow was executed and verified locally on the
# same toolchain before it was committed (no untested YAML):
#   backend-tests : python -m pam_master.keygen + drop the stale tracked
#                   public half (the repo tracks only the public key; a
#                   fresh private key must pair with a re-derived public,
#                   and the suite signs with the product's real key),
#                   then python -m pytest backend -q (host count;
#                   proven 2026-10-16 in a committed-tree-only container
#                   mirror: 794 passed)
#   docker-tests  : compose run ... pytest tests -q      (in-container count)
#   lint          : ruff 0.17.0, pyflakes errors gate (E9,F63,F7,F82) - clean
#   security      : bandit 1.9.4 High+Medium gate - 0 findings after the
#                   scheme-guard hardening (gateway_daemon/hsm/integrations/
#                   sso/service + radius usedforsecurity=False + sso XXE
#                   pre-scan); pip-audit 2.10.1 - no known vulnerabilities;
#                   gitleaks v8.24.2 with .gitleaks.toml - no leaks
#   frontend      : node --check parse gate over the standing-gate scripts,
#                   then the REAL standing gate on windows-latest: boot an
#                   ephemeral-key rig, seed it with tools/demo_seed.py, run
#                   __verify_agent.mjs (playwright, msedge preinstalled) in
#                   open mode and __verify_live.mjs over the wired screens,
#                   then a token-mode rig with GATE_ADMIN_TOKEN. Every
#                   command was executed locally on the same toolchain
#                   first (the demo seed and both gate modes ran against
#                   real rigs on this Windows box before the YAML shipped).
#   frontend-rebuild : pnpm@12.11.2 (node 24) in frontend/app - install
#                   --frozen-lockfile, pnpm audit (no known vulnerabilities,
#                   added 2026-10-16 batch C), orval regenerate + git diff
#                   --exit-code (client/contract drift), prettier --check,
#                   eslint, tsc --noEmit, playwright chromium, vitest run
#                   (jsdom + Storybook browser project), vite build,
#                   build-storybook; every command executed locally first
#                   (F1+F2+F3, 2026-10-13; audit step verified locally
#                   2026-10-16).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend suite (Linux host count)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install declared dependencies only
        run: pip install -r backend/phase2_license_server/requirements.txt -r backend/ipam_licensing/requirements.txt
      # Root cause of the first 16 red runs (2026-10-12..16), in two
      # acts - each reproduced in a committed-tree-only container mirror
      # of this job before this YAML was written:
      #   1. the repo rightly tracks no PRIVATE key material, and every
      #      test config points at the repo-root custody key with
      #      autogenerate_keys=False on purpose (the suite signs with
      #      the product's real key) -> a fresh checkout died with 678x
      #      keys.KeyConfigError "Private key not found" (run #14 log:
      #      7 failed / 109 passed / 678 errors).
      #   2. the LICENSE_AUTOGENERATE_KEYS=1 hypothesis (the gate job's
      #      pattern) never reaches the test configs - tested, retracted.
      #   3. pam_master.keygen creates the private half but never
      #      touches the TRACKED public half (by design - it ships to
      #      clients), and the pair-consistency check refuses a
      #      mismatched pair, so the stale public half goes; first boot
      #      re-derives it from the new private key (keys.py
      #      _check_public_key writes the public when it is missing).
      # Mirror result with these exact steps: 794 passed.
      - name: Generate the signing keys once (the repo tracks only the public half)
        working-directory: pam_master
        run: python -m pam_master.keygen
      - name: Drop the stale committed public half (re-derived at first boot)
        run: rm license_public_key.pem
      - name: Full backend suite
        run: python -m pytest backend -q

  docker-tests:
    name: In-container suite (dev image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the dev image and run the baked-in tests
        run: docker compose -f backend/phase2_license_server/docker-compose.yml run --build --rm --no-deps license-server python -m pytest tests -q

  lint:
    name: Ruff (pyflakes errors gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff==0.17.0
      - name: Undefined names, syntax errors, f-string traps (E9,F63,F7,F82)
        run: ruff check backend --select E9,F63,F7,F82

  security:
    name: Security scanners (bandit, pip-audit, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks watches the whole history, not just the tip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install bandit==1.9.4 pip-audit==2.10.1
      - name: Bandit - High and Medium severities fail the build
        run: bandit -q -r backend/phase2_license_server backend/ipam_licensing --exclude '*/tests/*,*/test_*' -ll
      - name: Known-vulnerability audit of declared dependencies
        run: pip-audit -r backend/phase2_license_server/requirements.txt
      - name: Secret scan over full history (documented allowlist in .gitleaks.toml)
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 detect --source /repo --config /repo/.gitleaks.toml

  frontend-rebuild:
    name: Frontend rebuild app (pnpm, format+lint+typecheck+test+build+storybook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pnpm 12.11.2 (same command proven locally on F1 day)
        run: npm install -g pnpm@12.11.2 && pnpm --version
      - name: Install declared dependencies only (lockfile frozen)
        working-directory: frontend/app
        run: pnpm install --frozen-lockfile
      - name: Known-vulnerability audit of declared frontend dependencies
        working-directory: frontend/app
        run: pnpm audit
      - name: OpenAPI client drift check (regenerate from apis/openapi.yaml)
        working-directory: frontend/app
        run: |
          pnpm openapi
          git diff --exit-code -- src/api/generated
      - name: System-map drift check (regenerate nav/router/client/openapi/backend extraction)
        # ADR-0013: /topology renders topology.generated.ts and the
        # Mermaid docs under docs/architecture/ - a route, contract or
        # backend-tree change without regeneration fails here.
        working-directory: frontend/app
        run: |
          pnpm topology
          git diff --exit-code -- src/features/topology/topology.generated.ts ':(top)docs/architecture'
      - name: Prettier format check
        working-directory: frontend/app
        run: pnpm format:check
      - name: ESLint
        working-directory: frontend/app
        run: pnpm lint
      - name: TypeScript strict check
        working-directory: frontend/app
        run: pnpm typecheck
      - name: Install Playwright chromium (Storybook browser test project)
        working-directory: frontend/app
        run: pnpm exec playwright install --with-deps chromium
      - name: Vitest (jsdom + Storybook browser, includes axe checks)
        working-directory: frontend/app
        run: pnpm test
      - name: Production build (offline bundle)
        working-directory: frontend/app
        run: pnpm build
      - name: Storybook static build (stories compile)
        working-directory: frontend/app
        run: pnpm build-storybook

  frontend:
    name: Frontend standing gate (boot rig, seed, playwright)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Parse-check every standing-gate script
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem shots_tool -Filter *.mjs) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - name: Install declared backend dependencies only
        run: pip install -r backend/phase2_license_server/requirements.txt -r backend/ipam_licensing/requirements.txt
      - name: Install the gate's browser tooling (playwright-core)
        working-directory: shots_tool
        run: npm ci
      - name: "Open-mode rig: boot, seed, standing gate, live-screen verify"
        shell: pwsh
        run: |
          $keydir = Join-Path $env:RUNNER_TEMP "vypam-ci-keys"
          New-Item -ItemType Directory -Force -Path $keydir | Out-Null
          $env:LICENSE_DATABASE_URI = "sqlite:///" + ((Join-Path $env:RUNNER_TEMP "vypam_ci_open.db") -replace '\\','/')
          $env:LICENSE_SERVER_PORT = "5000"
          $env:PAM_NODE_NAME = "ci-rig"
          $env:LICENSE_PRIVATE_KEY_PATH = Join-Path $keydir "ci_private.pem"
          $env:LICENSE_PUBLIC_KEY_PATH = Join-Path $keydir "ci_public.pem"
          $env:LICENSE_ED25519_PRIVATE_KEY_PATH = Join-Path $keydir "ci_ed25519_private.pem"
          $env:LICENSE_ED25519_PUBLIC_KEY_PATH = Join-Path $keydir "ci_ed25519_public.pem"
          $env:LICENSE_AUTOGENERATE_KEYS = "1"
          $proc = Start-Process python -ArgumentList "app.py" -PassThru -WorkingDirectory backend/phase2_license_server -RedirectStandardOutput rig.log -RedirectStandardError rig.err.log
          $health = $null
          foreach ($i in 1..45) {
            try { $health = Invoke-RestMethod http://127.0.0.1:5000/health -TimeoutSec 2; if ($health.status -eq "ok") { break } } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $health -or $health.status -ne "ok") { Get-Content rig.log -ErrorAction SilentlyContinue; Get-Content rig.err.log -ErrorAction SilentlyContinue; throw "rig did not become healthy" }
          python tools/demo_seed.py --private-key $env:LICENSE_PRIVATE_KEY_PATH
          if ($LASTEXITCODE -ne 0) { throw "demo seed failed" }
          $env:BASE = "http://127.0.0.1:5000"
          node shots_tool/__verify_agent.mjs
          if ($LASTEXITCODE -ne 0) { throw "standing gate (open mode) failed" }
          node shots_tool/__verify_live.mjs
          if ($LASTEXITCODE -ne 0) { throw "live-screen verify failed" }
          Stop-Process -Id $proc.Id -Force
      - name: "Token-mode rig: boot, seed with the admin token, standing gate"
        shell: pwsh
        run: |
          $keydir = Join-Path $env:RUNNER_TEMP "vypam-ci-keys-token"
          New-Item -ItemType Directory -Force -Path $keydir | Out-Null
          $env:LICENSE_DATABASE_URI = "sqlite:///" + ((Join-Path $env:RUNNER_TEMP "vypam_ci_token.db") -replace '\\','/')
          $env:LICENSE_SERVER_PORT = "5001"
          $env:PAM_NODE_NAME = "ci-rig"
          $env:LICENSE_ADMIN_TOKEN = "ci-gate-token-" + [guid]::NewGuid().ToString("N").Substring(0, 12)
          $env:LICENSE_PRIVATE_KEY_PATH = Join-Path $keydir "ci_private.pem"
          $env:LICENSE_PUBLIC_KEY_PATH = Join-Path $keydir "ci_public.pem"
          $env:LICENSE_ED25519_PRIVATE_KEY_PATH = Join-Path $keydir "ci_ed25519_private.pem"
          $env:LICENSE_ED25519_PUBLIC_KEY_PATH = Join-Path $keydir "ci_ed25519_public.pem"
          $env:LICENSE_AUTOGENERATE_KEYS = "1"
          $proc = Start-Process python -ArgumentList "app.py" -PassThru -WorkingDirectory backend/phase2_license_server -RedirectStandardOutput rig-token.log -RedirectStandardError rig-token.err.log
          $health = $null
          foreach ($i in 1..45) {
            try { $health = Invoke-RestMethod http://127.0.0.1:5001/health -TimeoutSec 2; if ($health.status -eq "ok") { break } } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $health -or $health.status -ne "ok") { Get-Content rig-token.log -ErrorAction SilentlyContinue; Get-Content rig-token.err.log -ErrorAction SilentlyContinue; throw "token rig did not become healthy" }
          python tools/demo_seed.py --base http://127.0.0.1:5001 --admin-token $env:LICENSE_ADMIN_TOKEN --private-key $env:LICENSE_PRIVATE_KEY_PATH
          if ($LASTEXITCODE -ne 0) { throw "demo seed (token mode) failed" }
          $env:BASE = "http://127.0.0.1:5001"
          $env:GATE_ADMIN_TOKEN = $env:LICENSE_ADMIN_TOKEN
          node shots_tool/__verify_agent.mjs
          if ($LASTEXITCODE -ne 0) { throw "standing gate (token mode) failed" }
          Stop-Process -Id $proc.Id -Force
