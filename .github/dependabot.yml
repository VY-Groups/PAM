# Dependabot — plan §9 "Automate checks" (added 2026-10-16, batch C of the
# workspace audit).
#
# 2026-10-16 follow-up (user decision): the initial weekly version-update
# sweep opened 11 PRs within minutes (majors included: pytest 8->9,
# actions/checkout 7, playwright-core — none of them *needed*). They were
# all closed un-reviewed on purpose: merging unverified bumps is not how
# this repo works. `open-pull-requests-limit: 0` therefore keeps every
# ecosystem on SECURITY updates only — a CVE in a declared dependency
# still opens a PR (that is the part worth automating); routine version
# bumps stay a deliberate, reviewed human step. CI (ci.yml) is the merge
# gate: backend suite (host + container), scanners, frontend battery,
# standing gate.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend/phase2_license_server
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /backend/ipam_licensing
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /frontend/app
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /shots_tool
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
